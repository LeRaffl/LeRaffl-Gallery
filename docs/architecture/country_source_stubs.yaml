  # ======================================================================
  # National sources — automated fetchers (their own pipeline, no doc yet)
  # ======================================================================
  - country: Brazil
    slug: brazil
    method: file
    summary: "New registrations of cars and light commercials for Brazil, from ANFAVEA."
    source_name: "ANFAVEA — edições em Excel"
    source_url: "https://anfavea.com.br/site/edicoes-em-excel/"
    underlying: "ANFAVEA — Associação Nacional dos Fabricantes de Veículos Automotores"
    variants: [Whole]
    variant_notes:
      Whole: "Automóveis e Comerciais Leves — passenger cars and light commercials combined."
    scope_note: "Cars + light commercials (Automóveis e Comerciais Leves). Trucks and buses are in the workbook but not ingested."
    cadence: "monthly cron on the 10th, 08:50 UTC"
    fetcher: "scripts/fetch_brazil.py"
    workflow: ".github/workflows/fetch-brazil.yml"
    data_file: "data/Brazil.csv"
    notes:
      - "Brazil's figures come from ANFAVEA, the national manufacturers' association, published as one Excel workbook per year that our fetcher downloads and parses — sheet «III. Emplacamento Combustível», the Unidades table for Automóveis e Comerciais Leves."
      - "Brazil is the one country where FLEXFUEL is its own column and the largest one: most Brazilian cars run on any petrol/ethanol blend. It counts as combustion in the three-curve view, not as an alternative fuel."
    caveats:
      - "Cars and light commercials are combined — this is not a passenger-car-only series like most of the gallery."
      - "Association aggregate: a non-member brand (historically BYD across Latin America) can be under-counted in the BEV figure."
      - "Delivered as a yearly Excel workbook; mid-year revised editions (the `-N` suffixed files) are intentionally ignored."

  - country: Chile
    slug: chile
    method: pdf
    summary: "New-vehicle sales for Chile from ANAC, the national automotive association."
    source_name: "ANAC — estudios de mercado"
    source_url: "https://www.anac.cl/category/estudio-de-mercado/"
    underlying: "ANAC — Asociación Nacional Automotriz de Chile"
    variants: [Whole]
    variant_notes:
      Whole: "New light-vehicle sales as reported by ANAC."
    cadence: "daily cron from the 14th, 08:20 UTC — runs are no-ops until both ANAC PDFs are out"
    fetcher: "scripts/fetch_chile.py"
    workflow: ".github/workflows/fetch-chile.yml"
    data_file: "data/Chile.csv"
    notes:
      - "Chile's figures come from ANAC, which publishes two monthly PDFs — «Mercado Automotor» (the overall market) and «Informe Cero y Bajas Emisiones» (the zero-/low-emission detail). The fetcher takes the total from the first and the BEV/PHEV/HEV split from the second, and only writes a month once both are out."
      - "Combustion is reported as one aggregate ICE figure; petrol and diesel are not split, so those columns stay empty."
    caveats:
      - "Association aggregate: ANAC counts member brands."
      - "No petrol/diesel split — combustion is a single ICE column."
      - "The two monthly PDFs are not always published on the same day, so a month only appears once the second one lands."

  - country: Japan
    slug: japan
    method: file
    summary: "New-vehicle registrations for Japan from the dealers' association (JADA)."
    source_name: "JADA — 燃料別メーカー別登録台数（乗用車）"
    source_url: "https://www.jada.or.jp/pages/342/"
    underlying: "JADA — Japan Automobile Dealers Association"
    variants: [Whole]
    variant_notes:
      Whole: "Registered passenger cars (登録車) — kei cars are excluded."
    scope_note: "登録車 (registered passenger cars) only. Kei cars (軽自動車) are NOT included."
    cadence: "daily cron, 08:00 UTC — no-op until JADA publishes, usually the first business week"
    fetcher: "scripts/fetch_japan.py"
    workflow: ".github/workflows/fetch-japan.yml"
    data_file: "data/Japan.csv"
    notes:
      - "Japan's registrations come from JADA (Japan Automobile Dealers Association), which publishes a monthly 燃料別メーカー別登録台数（乗用車） file — registrations by fuel type and manufacturer. Each publication is a rolling four-month rollup; we take the newest month. The XLSX is parsed by preference, the PDF is a fallback layout carrying the same data."
      - "Fuel-cell vehicles (ＦＣＶ) and その他 are summed into OTHERS."
    caveats:
      - "Kei cars (軽自動車) are excluded — the file's own footer says so (「軽自動車は含みません」). Kei cars are roughly a third of the Japanese light-vehicle market, so this is NOT the whole Japanese car market and its BEV share is not comparable with a kei-inclusive figure."
      - "Delivered as a monthly Excel workbook (PDF fallback)."

  - country: USA
    slug: usa
    method: pdf
    summary: "US light-duty EV/PHEV sales estimates from Argonne National Laboratory."
    source_name: "Argonne National Laboratory — monthly sales PDF"
    source_url: "https://www.anl.gov/esia/reference/light-duty-electric-drive-vehicles-monthly-sales-updates-historical-data"
    underlying: "Argonne National Laboratory — light-duty electric-drive sales updates"
    variants: [Whole]
    variant_notes:
      Whole: "All light-duty vehicles — cars and light trucks combined."
    scope_note: "Light-duty vehicles (cars + light trucks), US sales."
    cadence: "daily cron from the 10th, 10:30 UTC"
    fetcher: "scripts/fetch_usa.py"
    workflow: ".github/workflows/fetch-usa.yml"
    data_file: "data/USA.csv"
    notes:
      - "The US has no single federal new-registration feed, so the gallery uses Argonne National Laboratory's monthly light-duty electric-drive vehicle sales updates, published as a «Total Sales for Website» PDF that our fetcher parses. These are modelled sales estimates rather than a registry count."
      - "Argonne publishes BEV, PHEV, HEV and the light-duty total. Combustion is therefore a residual — ICE = Total − BEV − PHEV − HEV — so there is no petrol/diesel split and OTHERS is always 0."
    caveats:
      - "Modelled sales estimates (Argonne), not a national registration count."
      - "No petrol/diesel split: combustion is one derived ICE figure."
      - "Argonne revises the last ~2 months between releases. Each run re-reads a trailing window and corrects those months in place; rows older than the window are left as first recorded, so deep history can differ from a newer PDF."

  - country: Türkiye
    slug: turkiye
    method: pdf
    summary: "New-vehicle registration data for Türkiye from the national statistics institute (TÜİK)."
    source_name: "TÜİK Veri Portalı — Motorlu Kara Taşıtları bulletins"
    source_url: "https://veriportali.tuik.gov.tr/"
    underlying: "TÜİK — Turkish Statistical Institute"
    variants: [Whole]
    variant_notes:
      Whole: "Otomobil (passenger cars) only — the one category TÜİK breaks down by fuel."
    scope_note: "Otomobil (passenger cars). The bulletin covers eight vehicle categories but only otomobil carries a fuel split."
    cadence: "daily cron from the 15th, 08:30 UTC, but a no-op until the maintainer supplies the bulletin id"
    fetcher: "scripts/fetch_turkey.py"
    workflow: ".github/workflows/fetch-turkey.yml"
    data_file: "data/Türkiye.csv"
    hev_note: "Hybrids are a single combined bucket, placed in the HEV column; PHEV is left empty."
    notes:
      - "Türkiye's figures come from TÜİK, the Turkish Statistical Institute, from its monthly «Motorlu Kara Taşıtları» press bulletin. TÜİK is the official statistics body, so coverage of registrations is complete."
      - "The bulletin's authoritative monthly and year-to-date totals are read from the narrative text; the per-fuel breakdown only exists as an image, so it is OCR'd. Three checks guard the result: narrative-vs-OCR total, a per-fuel sum check with a single-error repair via the published percentages, and a cross-check against the same month a year earlier."
      - "The Veri Portalı is a React SPA with no listing endpoint, so the bulletin for a given month is found by walking bulletin ids outward from the newest one already recorded in the CSV and matching on title and period. Nothing is hard-coded and the anchor re-derives itself each month."
    caveats:
      - "Hybrids are reported as one combined bucket (the Türkiye/Georgia convention), placed in the HEV column — PHEV and HEV cannot be separated."
      - "The fuel table is an image in the bulletin, not markup, so the per-fuel numbers are OCR'd rather than read."

