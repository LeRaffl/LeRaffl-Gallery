    underlying: "SMMT — Society of Motor Manufacturers and Traders (from DVLA data)"
    variants: [Whole]
    data_file: "data/UK.csv"
    notes:
      - "The SMMT (Society of Motor Manufacturers and Traders) compiles the UK's monthly new-car-registration figures from DVLA registration data and publishes them with a powertrain breakdown (BEV, PHEV, hybrid, petrol, diesel). It's the standard UK market reference."
      - "The UK is not pulled by the ACEA fetcher (which skips it); the monthly SMMT release is transcribed by hand."
    caveats:
      - "Compiled by SMMT from DVLA registrations — effectively complete for the UK market."
      - "Maintained by hand; the latest month appears once it has been transcribed."

