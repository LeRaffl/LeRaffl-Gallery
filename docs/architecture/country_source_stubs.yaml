# Brief "stub" entries for gallery countries that are live but don't yet have
# a full docs/architecture/NN-source-*.md write-up. Each becomes a source page
# marked as a brief entry. When a country gets a proper source doc with
# front-matter, delete its stub here — the generator lets the doc win on a
# slug clash and --check flags a leftover duplicate.
#
# Facts are grounded in params.csv's `source` column. source_url is set only
# where the canonical page is known; where it isn't, the entry shows the source
# name as plain text and says so, rather than link somewhere unverified.

stubs:
