  # ======================================================================
  # National sources — automated fetchers (their own pipeline, no doc yet)
  # ======================================================================
  - country: Brazil
    slug: brazil
    method: file
    summary: "New-vehicle registrations for Brazil from ANFAVEA, the manufacturers' association."
    source_name: "ANFAVEA — yearly Excel workbook"
    source_url: "https://www.anfavea.com.br/"
    underlying: "ANFAVEA — Associação Nacional dos Fabricantes de Veículos Automotores"
    variants: [Whole]
    data_file: "data/Brazil.csv"
    notes:
      - "Brazil's figures come from ANFAVEA, the national manufacturers' association, published as one Excel workbook per year that our fetcher downloads and parses. It counts vehicles from ANFAVEA's member brands."
    caveats:
      - "Association aggregate: a non-member brand (historically BYD across Latin America) can be under-counted in the BEV figure."
      - "Delivered as a yearly Excel workbook; mid-year revised editions are intentionally ignored."

  - country: Chile
    slug: chile
    method: pdf
    summary: "New-vehicle sales for Chile from ANAC, the national automotive association."
    source_name: "ANAC — monthly PDFs"
    source_url: "https://www.anac.cl/"
    underlying: "ANAC — Asociación Nacional Automotriz de Chile"
    variants: [Whole]
    data_file: "data/Chile.csv"
    notes:
      - "Chile's figures come from ANAC, which publishes two monthly PDFs — a general market report and a zero-/low-emission report. Our fetcher parses both and merges them."
    caveats:
      - "Association aggregate: ANAC counts member brands."
      - "The two monthly PDFs aren't always published on the same day, so a month can land in two steps."

