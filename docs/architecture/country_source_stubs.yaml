# Registry entries for gallery countries that don't have a full
# docs/architecture/NN-source-*.md write-up. Two kinds live here:
#
#   * source_group: acea  — countries whose figures come from ACEA's monthly
#     press-release PDF. They stay lean; the generator injects one shared
#     "About the ACEA figures" explainer, so the paragraph isn't repeated ~18×.
#   * national sources    — Germany, UK, Brazil, … — expanded with a `notes`
#     paragraph so each reads as a proper page.
#
# `method` (required) is how the data is acquired: api | scrape | pdf | file |
# manual. Facts are grounded in params.csv's `source` column and the fetchers.
# When a country gets a full source doc, delete its entry here (the doc wins on
# a slug clash and --check flags a leftover duplicate).

