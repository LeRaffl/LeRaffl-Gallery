      - "Parsed from a monthly TÜİK press-release PDF."

  # ======================================================================
  # National sources — maintained by hand (no automated fetcher)
  # ======================================================================
  - country: Germany
    slug: germany
    method: manual
    summary: "New passenger-car registrations for Germany from the Kraftfahrt-Bundesamt (KBA)."
    source_name: "KBA — Kraftfahrt-Bundesamt"
    source_url: "https://www.kba.de/"
    underlying: "KBA — Germany's federal motor-transport authority (the registry)"
    variants: [Whole]
    data_file: "data/Germany.csv"
    notes:
      - "The KBA (Kraftfahrt-Bundesamt) is Germany's federal motor-transport authority and the official vehicle register. It publishes monthly new-registration counts (Neuzulassungen) broken down by fuel type. Because it's the registry itself, coverage is complete — every registered car, not an association sample."
      - "Germany is not pulled by the ACEA fetcher (which skips it); the monthly KBA figures are transcribed by hand."
    caveats:
      - "Official registry — complete coverage, not an association sample."
      - "Maintained by hand; the latest month appears once it has been transcribed."

