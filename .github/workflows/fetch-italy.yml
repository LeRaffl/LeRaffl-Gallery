name: Fetch Italy data (UNRAE)

# Scrapes UNRAE monthly bulletins and upserts three Italy CSV files:
#
#   data/Italy.csv             — PKW Whole (Struttura del mercato, inkl. Noleggio)
#   data/Italy_Rental.csv      — PKW Rental  (Whole − al netto del noleggio)
#   data/Italy_NonRental.csv   — PKW NonRental (al netto del noleggio block, direct)
#   data/Italy_Vans.csv        — LCV Vans (autocarri ≤ 3,5 t struttura, exact counts)
#
# PKW (Whole + Private) comes from unrae.it/dati-statistici/immatricolazioni,
# published around the 1st of each month.  Polled 4×/day on the 1st–3rd.
#
# Vans (LCV) comes from the "immatricolazioni-veicoli-commerciali" struttura
# PDF on the same index, published around the 10th (July+August together in
# September).  Polled 3×/day on the 8th–16th.  History: backfill_italy_vans.py.
#
# Top brands / models (Whole, BEV + PHEV): market/italy_top.json and its month
# store market/italy_months.json, from UNRAE's "per modello" lists, refreshed
# when the top file is behind the newest month.  Committed, never rendered.
#
# The script self-throttles per variant via the latest period already in each
# CSV, so most invocations are no-ops.  When a CSV changes, render-country.yml
# runs for the affected variants (serial reusable-workflow matrix).
#
# See scripts/fetch_italy.py and docs/architecture/18-source-italy.md.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to fetch (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - pkw
          - Whole
          - Rental
          - NonRental
          - Vans
      pdf_url:
        description: 'Direct PKW Struttura PDF URL (overrides discovery; requires year+month)'
        required: false
        default: ''
      vans_pdf_url:
        description: 'Direct LCV struttura PDF URL (overrides discovery; periods come from the PDF)'
        required: false
        default: ''
      year:
        description: 'Target year (required with pdf_url)'
        required: false
        default: ''
      month:
        description: 'Target month 1-12 (required with pdf_url)'
        required: false
        default: ''
      force:
        description: 'Re-process even if target period already exists'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # PKW (Whole + Private): 06/10/14/18 UTC on 1st-3rd
    # Covers UNRAE's typical release window (Italian morning of the 1st).
    - cron: '0 6,10,14,18 1-3 * *'
    # Vans (LCV): 10/14/18 UTC on 8th-16th
    # The LCV struttura PDF is published around the 10th of each month.
    - cron: '0 10,14,18 8-16 * *'

jobs:
  fetch:
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      variants_json: ${{ steps.changed.outputs.variants_json }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install poppler (pdftotext)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install Python dependencies
        run: pip install requests

      - name: Parser self-test
        run: python scripts/test_fetch_italy.py

      # Offline; guards the top brands/models builder (scripts/market_top.py)
      # and the Italy model-list parser before they touch market/.
      - name: Top brands/models self-test
        run: python scripts/test_market_top.py

      - name: Fetch & update Italy CSVs
        id: fetch
        run: |
          python scripts/fetch_italy.py \
            ${VARIANT:+--variant "$VARIANT"} \
            ${PDF_URL:+--pdf-url "$PDF_URL"} \
            ${VANS_PDF_URL:+--vans-pdf-url "$VANS_PDF_URL"} \
            ${YEAR:+--year "$YEAR"} \
            ${MONTH:+--month "$MONTH"} \
            ${FORCE:+--force}
        env:
          VARIANT:      ${{ inputs.variant }}
          PDF_URL:      ${{ inputs.pdf_url }}
          VANS_PDF_URL: ${{ inputs.vans_pdf_url }}
          YEAR:         ${{ inputs.year }}
          MONTH:        ${{ inputs.month }}
          FORCE:        ${{ inputs.force == true && '1' || '' }}

      # A Vans failure (fetch_italy.py sets vans_failed) still fails the run,
      # but must not drop PKW rows written earlier in the same invocation.
      - name: Detect which CSVs changed
        id: changed
        if: success() || steps.fetch.outputs.vans_failed == 'true'
        run: |
          touched=()
          # Vans is fetched and committed but intentionally NOT rendered:
          # the variant is excluded from params.csv/weights.csv for now.
          for pair in "Whole:data/Italy.csv" \
                      "Rental:data/Italy_Rental.csv" \
                      "NonRental:data/Italy_NonRental.csv"; do
            variant="${pair%%:*}"
            file="${pair##*:}"
            [ -f "$file" ] || continue
            git add -N "$file" 2>/dev/null || true
            if ! git diff --quiet -- "$file"; then
              touched+=("$variant")
            fi
          done
          variants=$(IFS='|'; echo "${touched[*]}")
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          # JSON array for the serial render matrix below
          if [ ${#touched[@]} -eq 0 ]; then
            json="[]"
          else
            json=$(printf '"%s",' "${touched[@]}"); json="[${json%,}]"
          fi
          echo "variants_json=$json" >> "$GITHUB_OUTPUT"
          echo "Touched variants: ${variants:-<none>}"

      - name: Commit if changed
        id: commit
        if: success() || steps.fetch.outputs.vans_failed == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Italy.csv
            data/Italy_Rental.csv
            data/Italy_NonRental.csv
            data/Italy_Vans.csv
            market/italy_top.json
            market/italy_months.json
          message: 'chore: update Italy data from UNRAE'
          default_author: github_actions
          # Rebase over anything (manifest/source-page CI, another fetcher, a
          # doc push) that landed on the branch while this job ran, instead of
          # failing the push with non-fast-forward and dropping the commit.
          pull: '--rebase --autostash'

  # Render the touched variants as ONE top-level "Render: Italy" run in the
  # Render-country-charts workflow, so it shows up in that workflow's own
  # history (scannable from the mobile GitHub app) instead of a matrix nested
  # inside this fetcher's run. We dispatch render-country.yml ONCE with the
  # pipe-joined variant list; it renders them serially in a single job and
  # commits once — so unlike the abandoned per-variant `gh workflow run`
  # fan-out (parallel renders that raced on params.csv/weights.csv), there is
  # only one render run and nothing races.
  render:
    needs: fetch
    # !cancelled(): still render committed PKW rows when the job failed on Vans.
    if: "!cancelled() && needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.variants_json != '[]'"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Italy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.variants_json }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country=Italy \
            -f variants="$variants"
