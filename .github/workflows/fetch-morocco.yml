name: Fetch Morocco data (AIVAM) — probe

# Source-shape probe for Morocco/AIVAM: crawls the publication pages and
# dumps the newest PDFs' text to verify whether AIVAM's own monthly PDF
# carries the per-energy split. No data is written yet.

on:
  workflow_dispatch:

# One run per fetcher at a time: a manual dispatch or a late cron tick
# queues behind a running fetch instead of racing it to the same CSVs.
# Not cancelled (a half-written fetch is worse than a wait).
concurrency:
  group: fetch-morocco
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pdfplumber xlrd openpyxl
      - name: Probe
        run: python scripts/fetch_morocco.py --probe
