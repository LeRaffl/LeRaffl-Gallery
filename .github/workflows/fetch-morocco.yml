name: Fetch Morocco data (AIVAM) — probe

# Source-shape probe for Morocco/AIVAM: crawls the publication pages and
# dumps the newest PDFs' text to verify whether AIVAM's own monthly PDF
# carries the per-energy split. No data is written yet.

on:
  workflow_dispatch:
  # DEV: temporary trigger while the fetcher is developed on the expansion
  # branch; remove before merging.
  push:
    branches: [claude/portfolio-country-expansion-95a8bb]
    paths:
      - 'scripts/fetch_morocco.py'
      - '.github/workflows/fetch-morocco.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pdfplumber xlrd openpyxl
      - name: Probe
        run: python scripts/fetch_morocco.py --probe
