name: probe-tmp (temporary, removed before merge)

# Phase 0 probe pattern (docs/architecture/42-adding-a-country.md): runs on a
# push to this branch, commits probe_out/ back to it. Deleted before merge.
on:
  push:
    branches: [feat/fi-register-hev]
    paths: [scripts/probe_tmp.py, .github/workflows/probe-tmp.yml]

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests pypdf
      - run: python scripts/probe_tmp.py
      # The render preview's PNGs, for review outside GitHub (base R vs PR R).
      - name: Fetch the render-preview PNGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/rp probe_out/preview
          gh run download 44798651925 -R "$GITHUB_REPOSITORY" -n render-preview -D /tmp/rp
          find /tmp/rp -type f | sed 's|/tmp/rp/||' | sort > probe_out/preview/files.txt
          find /tmp/rp -type f -iname '*.png' | grep -E -i 'finland|czech|vietnam' | while read -r f; do
            rel="${f#/tmp/rp/}"; mkdir -p "probe_out/preview/$(dirname "$rel")"; cp "$f" "probe_out/preview/$rel"
          done
      - name: Commit probe output
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add --sparse -f probe_out
          git commit -m "chore: probe output (temporary)" || exit 0
          git pull --rebase
          git push
