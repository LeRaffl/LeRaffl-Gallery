name: probe-tmp (temporary, removed before merge)

# Phase 0 probe pattern (docs/architecture/42-adding-a-country.md): runs on a
# push to this branch, commits probe_out/ back to it. Deleted before merge.
on:
  push:
    branches: [feat/nl-register-hev]
    paths: [scripts/probe_tmp.py, .github/workflows/probe-tmp.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            data
            market
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: DNS check (opendata.rdw.nl)
        run: |
          for r in "" @8.8.8.8 @1.1.1.1; do echo "== dig $r"; dig +short $r opendata.rdw.nl || true; done
          dig +short NS rdw.nl @8.8.8.8 || true
          curl -sS -o /dev/null -w '%{http_code}\n' --max-time 30 'https://opendata.rdw.nl/resource/m9d7-ebf2.json?$limit=1' || true
      - run: python scripts/probe_tmp.py
      - name: Commit probe output
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add --sparse -f probe_out
          git commit -m "chore: probe output (temporary)" || exit 0
          git pull --rebase
          git push
