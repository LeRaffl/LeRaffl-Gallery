name: probe-tmp (temporary, removed before merge)

# Phase 0 probe pattern (docs/architecture/42-adding-a-country.md): runs on a
# push to this branch, commits probe_out/ back to it. Deleted before merge.
on:
  push:
    branches: [feat/nl-register-hev]
    paths: [scripts/probe_tmp.py, .github/workflows/probe-tmp.yml]

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            data
            market
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install "requests[socks]"
      - run: python scripts/probe_tmp.py
        env:
          NL_PROXY: ${{ secrets.NL_PROXY || secrets.AUSTRIA_PROXY }}
          NL_FETCH_RELAY: ${{ secrets.NL_FETCH_RELAY || secrets.AUSTRIA_FETCH_RELAY }}
          NL_RELAY_TOKEN: ${{ secrets.NL_RELAY_TOKEN || secrets.AUSTRIA_RELAY_TOKEN }}
      - name: Fetch the render-preview PNGs (Netherlands)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w preview-render.yml -b feat/nl-register-hev \
                   -e workflow_dispatch -L 1 --json databaseId,status -q '.[0] | select(.status=="completed") | .databaseId')
            [ -n "$id" ] && break; sleep 20
          done
          echo "preview run: $id"
          mkdir -p /tmp/rp probe_out/preview
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n render-preview -D /tmp/rp
          find /tmp/rp -type f -iname '*.png' | grep -i netherlands | while read -r f; do
            rel="${f#/tmp/rp/}"; mkdir -p "probe_out/preview/$(dirname "$rel")"; cp "$f" "probe_out/preview/$rel"
          done
          ls -R probe_out/preview
      - name: Commit probe output
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add --sparse -f probe_out
          git commit -m "chore: probe output (temporary)" || exit 0
          git pull --rebase
          git push
