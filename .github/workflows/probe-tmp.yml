# TEMPORARY probe for the Vietnam history PR: crawl vama.org.vn's sales-report
# archive (plain http only answers GitHub's runners) and save the PDFs as a
# workflow artifact. Nothing is committed. Removed before the PR is merged.
name: probe-tmp (Vietnam history)
on:
  push:
    branches: [feat/vietnam-history]
    paths: ['scripts/probe_tmp.py', '.github/workflows/probe-tmp.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - run: python3 scripts/probe_tmp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe_out
          path: probe_out/
          retention-days: 7
