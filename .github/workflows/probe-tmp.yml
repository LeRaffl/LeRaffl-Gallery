name: probe-tmp
on:
  push:
    branches: [claude/probe-countries]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - run: pip install requests
      - run: python scripts/probe_tmp.py
      - name: commit outputs
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add --sparse -f probe_out
          git commit -m "probe output [skip ci]" && git push || true
