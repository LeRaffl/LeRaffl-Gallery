name: Fetch Norway data (OFV)

# Fetches OFV's monthly new-car release (Opplysningsrådet for veitrafikken,
# compiled from the Statens vegvesen vehicle register) and upserts
# data/Norway.csv (Whole = new passenger cars, EU M1):
#
#   BEV / PHEV / HEV / PETROL / DIESEL / OTHERS / TOTAL from the article's
#   "Fordeling per drivstoff" table (Elektrisitet; Bensin/Diesel plugin
#   hybrid; Bensin/Diesel hybrid; Bensin; Diesel; rare fuels -> OTHERS).
#
# OFV's articles have no stable URL, so the script reads the posts published
# since the 1st of the next month from the RSS feed (ofv.no/aktuelt/rss.xml),
# falling back to the sitemap, and keeps the one whose fuel table is for the
# target month and whose brand table is about passenger cars (the van release
# of the next day has the same tables and is skipped). Every run checks the
# article against itself (rows sum to Total, printed shares — a shifted
# column fails) and against OFV's open JSON export
# (ofv.no/api/statistikk/export.json, CC BY 4.0): the month's Total and the
# year-to-date fuel mix must agree exactly. It also writes
# market/norway_top.json (OFV's top-30 brands and models, every powertrain;
# single months accumulate in market/norway_months.json).
# Full method, governance checks and a debugging runbook:
# docs/architecture/54-source-norway.md.
#
# OFV publishes month M early on the first working day of M+1 (September 2026:
# 1 October, 05:37 UTC). Polled at 07:10 and 15:10 UTC on the 1st-12th; once
# the month is in the CSV from OFV and the top file is current, a run exits
# without any HTTP request. A normal run reads the RSS feed, the export
# (~7 kB) and one or two articles (~250 kB each). From the 11th on, a release
# that still cannot be found is replaced by export.json's year-to-date minus
# the CSV's earlier months, written with notes "derived: ..." (and replaced by
# the article's figures once found); if that is impossible too, the run fails.
# ACEA (fetch-acea.yml) republishes OFV's figure about three weeks later and
# only fills a Norway month that is missing or already ACEA's.
#
# Rendering: dispatches render-country.yml ONCE with the changed variants.

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Target month YYYY-MM (default: the month that just ended)'
        required: false
        default: ''
      force:
        description: 'Overwrite an existing row for the month (any source) and skip the plausibility / year-to-date guards'
        required: false
        default: false
        type: boolean
  schedule:
    # 07:10 and 15:10 UTC on the 1st-12th (OFV releases early on the 1st working day).
    - cron: '10 7,15 1-12 * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      any_changed: ${{ steps.fetch.outputs.changed }}
      changed_variants: ${{ steps.fetch.outputs.changed_variants }}
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      # The table parser fails quietly when OFV changes its layout, so the
      # regression tests gate the fetch rather than trail it (no network).
      - name: Test the fetcher
        run: |
          python scripts/test_fetch_norway.py
          python scripts/test_market_top.py

      - name: Fetch & update the Norway CSV
        id: fetch
        run: |
          python scripts/fetch_norway.py \
            ${PERIOD:+--period "$PERIOD"} \
            ${FORCE:+--force}
        env:
          PERIOD: ${{ inputs.period }}
          FORCE:  ${{ inputs.force == true && '1' || '' }}

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Norway.csv
            market/norway_top.json
            market/norway_months.json
          message: 'chore: update Norway data from OFV'
          default_author: github_actions
          # Rebase over anything that landed while this job ran instead of
          # failing the push with non-fast-forward (same as fetch-spain.yml).
          pull: '--rebase --autostash'

  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.changed_variants != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Norway
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.changed_variants }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country="Norway" \
            -f variants="$variants"
