name: Fetch Spain data (DGT microdata)

# Fetches DGT monthly matriculaciones microdata and upserts the Spain CSVs
# (gallery schema with EREV column — EREV folds into PHEV in the 3-curve
# plot and gets its own TTM band, same as China). One download feeds every
# variant:
#
#   data/Spain.csv             Whole      turismos+todoterrenos (tipo 40/25), new
#   data/Spain_Rental.csv      Rental     Whole ∧ (alquiler sin conductor ∨ renting)
#   data/Spain_NonRental.csv   NonRental  Whole ∧ ¬Rental (exact complement)
#   data/Spain_Used.csv        Used       used cars at first Spanish registration
#   data/Spain_Vans.csv        Vans       EU N1 (vans & pickups ≤3.5t), new
#   data/Spain_HDV.csv         HDV        EU N2+N3 (trucks incl. tractor units), new
#   data/Spain_Buses.csv       Buses      EU M2+M3, new
#   data/Spain_2-Wheelers.csv  2-Wheelers motorcycles+mopeds (tipo 50/90), new
#
# Full user-facing definitions: docs/architecture/28-source-spain.md §5b.
# Whole is deliberately ~2% above ANFAC/ACEA (M1 people movers included) —
# see §4 there and footnotes.csv.
#
# Bootstrap: when a selected CSV does not exist, the script walks months
# descending to 2015-01, stops where the MATRABA layout era ends, and (for
# Whole) splices the remaining history from data/Spain_legacy.csv.
#
# Rendering: dispatches render-country.yml ONCE with the pipe-separated list of
# touched variants; it renders them serially in a single run (one "Render: Spain"
# entry in the Render-country-charts workflow) and commits once, so variants
# never race each other on the render commit.
#
# DGT publishes the monthly file on the 15th of the following month (06:30
# UTC, observed 2026-08/09). Until then the script sums that month's DAILY
# files (export_mat_YYYYMMDD.zip; day D is out on D+1 at 06:30 UTC, Friday's
# on Saturday ~13:00) into provisional rows — source "DGT (daily)", flagged in
# notes — but only once every weekday file is there. The monthly file then
# replaces them. Polled daily on the 1st–16th (plus an afternoon run on the
# 1st–3rd for a month ending on a Friday); the script self-throttles once the
# monthly file is in.
#
# Top brands/models: the script also keeps market/spain_top.json (trailing-12-
# month top brands and models per electrified class, Whole) and
# market/spain_used_top.json (the same for Used) current — rebuilt
# once per new DGT month, or whenever it is missing, from twelve monthly
# downloads. A change there is committed but never rendered (it only feeds the
# source page, via build-source-pages.yml); a failure there is a warning, never
# a failed fetch.
#
# See scripts/fetch_spain.py and docs/architecture/28-source-spain.md.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to fetch (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - Whole
          - Rental
          - NonRental
          - Used
          - Vans
          - HDV
          - Buses
          - 2-Wheelers
      period:
        description: 'Specific month YYYY-MM (default: previous month)'
        required: false
        default: ''
      backfill:
        description: 'Walk months descending to backfill_from'
        required: false
        default: false
        type: boolean
      backfill_from:
        description: 'Oldest month for the backfill walk'
        required: false
        default: '2015-01'
      force:
        description: 'Overwrite rows regardless of source string'
        required: false
        default: false
        type: boolean
  schedule:
    # Daily on the 1st–16th, 07:15 UTC — after DGT's 06:30 UTC drop of the
    # daily and monthly files. The monthly file lands on the 15th; before
    # that the daily files give a provisional month from the 1st.
    - cron: '15 7 1-16 * *'
    # Friday's daily file only appears on Saturday ~13:00 UTC, so a month
    # ending on a Friday needs an afternoon run to be complete on the 1st.
    - cron: '15 14 1-3 * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      any_changed: ${{ steps.fetch.outputs.changed }}
      changed_variants: ${{ steps.fetch.outputs.changed_variants }}
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      # Offline; guards the top brands/models parsing (scripts/market_top.py).
      - name: Test the top brands/models builder
        run: python scripts/test_market_top.py

      # Offline; guards the daily-file fallback (completeness rule, overwrite
      # order between provisional and monthly rows).
      - name: Test the Spain fetcher
        run: python scripts/test_fetch_spain.py

      - name: Fetch & update Spain CSVs
        id: fetch
        run: |
          python scripts/fetch_spain.py \
            ${VARIANT:+--variant "$VARIANT"} \
            ${PERIOD:+--period "$PERIOD"} \
            ${BACKFILL:+--backfill} \
            ${BACKFILL_FROM:+--backfill-from "$BACKFILL_FROM"} \
            ${FORCE:+--force}
        env:
          VARIANT:       ${{ inputs.variant }}
          PERIOD:        ${{ inputs.period }}
          BACKFILL:      ${{ inputs.backfill == true && '1' || '' }}
          BACKFILL_FROM: ${{ inputs.backfill_from }}
          FORCE:         ${{ inputs.force == true && '1' || '' }}

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Spain.csv
            data/Spain_Rental.csv
            data/Spain_NonRental.csv
            data/Spain_Used.csv
            data/Spain_Vans.csv
            data/Spain_HDV.csv
            data/Spain_Buses.csv
            data/Spain_2-Wheelers.csv
            market/spain_top.json
            market/spain_used_top.json
          message: 'chore: update Spain data from DGT'
          default_author: github_actions
          # Rebase over anything (manifest/source-page CI, another fetcher, a
          # doc push) that landed on the branch while this job ran, instead of
          # failing the push with non-fast-forward and dropping the commit.
          pull: '--rebase --autostash'

  # Render the touched variants as ONE top-level "Render: Spain" run in the
  # Render-country-charts workflow, so it shows up in that workflow's own
  # history (scannable from the mobile GitHub app) instead of a matrix nested
  # inside this fetcher's run. We dispatch render-country.yml ONCE with the
  # pipe-joined variant list; it renders them serially in a single job and
  # commits once — so unlike the abandoned per-variant `gh workflow run`
  # fan-out (parallel renders that raced on params.csv/weights.csv), there is
  # only one render run and nothing races. Spain has the widest fan-out (up to
  # 8 variants); render-country.yml's timeout is sized for that.
  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.changed_variants != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Spain
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.changed_variants }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country=Spain \
            -f variants="$variants"
