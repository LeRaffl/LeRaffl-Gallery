name: Fetch Georgia data (Geostat)

# Fetches Geostat's quarterly initial vehicle registrations by fuel type and
# upserts data/Georgia.csv (Whole = every vehicle registered in Georgia for
# the first time in the quarter: all vehicle categories, new and imported
# used — the scope the hand-entered series has always had):
#
#   Electric → BEV; Hybrid → HEV (one combined hybrid bucket, no PHEV column);
#   Gasoline + Gasoline-gas → PETROL; Diesel → DIESEL; Gas + Others → OTHERS.
#
# Source: the public JSON API behind Geostat's "Automobile" portal
# (autoapi.geostat.ge, no key; the portal page is
# https://automobile.geostat.ge/en/automobiles/rating with the period switch
# on "during the period"). Rows sit on the quarter's middle month
# (Feb/May/Aug/Nov), time_interval = quarterly.
# Every run checks Geostat's own year figure (quarter=99, January to the
# newest quarter) against the sum of the quarters, and the new quarter's
# total against the same quarter a year earlier (stops below 50 %).
# Also writes market/georgia_top.json (brands and models of the last four
# quarters, every powertrain, from Geostat's treemap).
# Full method, governance checks and a debugging runbook:
# docs/architecture/52-source-georgia.md.
#
# Geostat publishes a quarter some weeks after it ends (2026-Q2 was online
# before 2026-07-25). Polled daily at 06:55 UTC (10:55 Tbilisi) from the
# 10th to the end of the two months after each quarter. A normal run makes
# ONE small request (the period picker) and exits when the newest quarter is
# already in the CSV and the top file is current; a run that finds a new
# quarter reads it, the three before it (Geostat revisions are reported, not
# written) and their treemaps — about a dozen requests.
# `backfill` re-reads every quarter since 2017-Q1 (~70 requests) and only
# adds quarters the CSV lacks.
#
# Rendering: dispatches render-country.yml ONCE with the changed variants.

on:
  workflow_dispatch:
    inputs:
      quarter:
        description: 'Target quarter YYYY-Qn, e.g. 2026-Q3 (default: the newest Geostat lists)'
        required: false
        default: ''
      backfill:
        description: 'Re-read every quarter since 2017-Q1 and add the quarters the CSV lacks'
        required: false
        default: false
        type: boolean
      force:
        description: 'Overwrite rows that differ from Geostat and skip the completeness guard'
        required: false
        default: false
        type: boolean
  schedule:
    # 06:55 UTC, 10th-31st of Jan/Feb, Apr/May, Jul/Aug, Oct/Nov.
    - cron: '55 6 10-31 1,2,4,5,7,8,10,11 *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      any_changed: ${{ steps.fetch.outputs.changed }}
      changed_variants: ${{ steps.fetch.outputs.changed_variants }}
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      # The mapping fails quietly if Geostat renames a category, so the
      # regression tests gate the fetch rather than trail it (no network).
      - name: Test the fetcher
        run: |
          python scripts/test_fetch_georgia.py
          python scripts/test_market_top.py

      - name: Fetch & update the Georgia CSV
        id: fetch
        run: |
          python scripts/fetch_georgia.py \
            ${QUARTER:+--quarter "$QUARTER"} \
            ${BACKFILL:+--backfill} \
            ${FORCE:+--force}
        env:
          QUARTER:  ${{ inputs.quarter }}
          BACKFILL: ${{ inputs.backfill == true && '1' || '' }}
          FORCE:    ${{ inputs.force == true && '1' || '' }}

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Georgia.csv
            market/georgia_top.json
          message: 'chore: update Georgia data from Geostat'
          default_author: github_actions
          # Rebase over anything that landed while this job ran instead of
          # failing the push with non-fast-forward (same as fetch-spain.yml).
          pull: '--rebase --autostash'

  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.changed_variants != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Georgia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.changed_variants }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country="Georgia" \
            -f variants="$variants"
