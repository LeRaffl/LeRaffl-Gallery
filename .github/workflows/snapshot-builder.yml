name: Snapshot Builder curves

# Two jobs in one run, on two different questions:
#
#   1. snapshot_builder.py freezes what the Builder tab shows TODAY into
#      builder_history/<date>.csv. That record cannot be reconstructed later
#      — it carries whatever coverage and bugs we had — so it keeps being
#      written even though nothing renders it any more.
#   2. build_backtest.R answers "what would this model have said at date X",
#      by re-fitting from the CSVs. That reaches 2015, and it is what the
#      Time-lapse panel and the GIFs show.
#
# The two must never be mixed in one series; see the header of
# R/build_backtest.R for why, and for the limitation (revised data) that
# every consumer has to state.
#
# Cadence: 25th of each month at 09:00 UTC, after the bulk of the country
# fetches in the first two weeks have settled. Manual dispatch supports an
# optional --date override (useful for testing or labelling a back-dated run).

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Snapshot date YYYY-MM-DD (leave empty to use today UTC)'
        required: false
        default: ''
  schedule:
    - cron: '0 9 25 * *'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # The snapshot itself finishes in seconds; the budget is the backtest
    # extension, ~95 Weibull fits at ~1.8s each over 4 cores, plus R setup and
    # the GIF render. Still capped, so a hang fails fast and visibly instead
    # of burning ~40 min then being cancelled (as happened on the 2026-07-25
    # scheduled run) — raised from 10 when the backtest step was added.
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: snapshot-builder-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Snapshot Builder curves
        run: |
          python scripts/snapshot_builder.py ${DATE:+--date "$DATE"}
        env:
          DATE: ${{ inputs.date }}

      # `fit.R`/`data.R` are base R plus `parallel` — no CRAN packages, so no
      # `setup-r-dependencies` step and no restore cache to wait on.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Extend the backtest by the months that have appeared since the last
      # run. `build_backtest()` writes per month and skips what exists, so
      # this is ~95 fits (a couple of minutes) in the steady state — the
      # ~9,200-fit backfill from 2015 happened once, by hand.
      #
      # This is the series the Time-lapse actually shows: it re-fits from the
      # CSVs and so reaches 2015, where `builder_history/` cannot start before
      # the repository did (2025-09).
      - name: Extend backtest
        run: |
          Rscript -e 'source("R/build_backtest.R"); build_backtest(cores = 4)'

      # The new month has to reach the Time-lapse panel, which reads the
      # compact per-group files rather than the per-month CSVs. Leaving this
      # out would keep writing fits nobody can see.
      - name: Rebuild Time-lapse series
        run: |
          python scripts/build_backtest_series.py

      # One GIF per curated group, overwritten in place. Not dated: each run
      # is the same animation one frame longer, so keeping every vintage would
      # store the same seconds of footage over and over.
      - name: Render Time-lapse animations
        run: |
          pip install Pillow
          python scripts/build_builder_gif.py

      - name: Commit if changed
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            builder_history
            backtest
          message: 'chore: snapshot Builder curves + extend backtest (CI)'
          default_author: github_actions
          # Rebase onto the remote tip before pushing so a concurrent push
          # doesn't reject this one with a non-fast-forward error.
          pull: '--rebase --autostash'
