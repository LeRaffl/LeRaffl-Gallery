name: Fetch New Zealand data (NZTA Motor Vehicle Register)

# Counts New Zealand's first registrations from the NZTA Waka Kotahi Motor
# Vehicle Register (open data, CC BY 4.0) and upserts, by class x import status
#   data/New Zealand.csv         Whole  = new passenger cars (MA/MB/MC, M1)
#   data/New Zealand_Vans.csv    Vans   = new goods vehicles up to 3.5 t (NA, N1)
#   data/New Zealand_HDV.csv     HDV    = new goods vehicles over 3.5 t (NB/NC)
#   data/New Zealand_Used.csv    Used   = used-import passenger vehicles (MA/MB/MC)
#   market/new_zealand_top.json  brands and models per electrified class (Whole)
#
# The register is an ArcGIS feature service; the fetcher sends grouped count
# queries (a handful of small JSON requests, no record download). Its URL
# changes when NZTA republishes, so it is resolved from the Hub item on every
# run. NZTA reloads the register once a month, "accurate up to the end of the
# previous month" (September 2026 was loaded on 6 October, 03:46 UTC).
# Polled at 04:55 and 18:55 UTC on the 3rd-20th; once the month is in every CSV
# and the top file is current, a run exits without any HTTP request. Before
# the register covers the month a run is a no-op; from the 20th on that
# fails the run (refresh late, or the item moved).
#
# Until 2026-06 this workflow read transport.govt.nz, which went behind
# Imperva; rows before 2026-10 were entered by hand from that dashboard.
# That former series (new + used light vehicles) is parked unchanged in
# data/New Zealand_legacy.csv — an archive, never written here.
# Full method, governance checks and a debugging runbook:
# docs/architecture/19-source-new-zealand.md.
#
# Rendering: dispatches render-country.yml ONCE with the changed variants.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Comma-separated subset of Whole,Vans,HDV,Used (default: all)'
        required: false
        default: ''
      period:
        description: 'Target month YYYY-MM (default: the month that just ended)'
        required: false
        default: ''
      since:
        description: 'Backfill: also count every month from YYYY-MM on (adds only months the CSV lacks; old months undercount)'
        required: false
        default: ''
      force:
        description: 'Overwrite existing rows (any source) and skip the plausibility guard'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Query and validate only; write and commit nothing'
        required: false
        default: false
        type: boolean
  schedule:
    # 04:55 and 18:55 UTC on the 3rd-20th (NZTA reloads around the 5th).
    - cron: '55 4,18 3-20 * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed_variants: ${{ steps.fetch.outputs.changed_variants }}
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      # The mapping fails quietly when NZTA adds a MOTIVE_POWER label, so the
      # regression tests gate the fetch rather than trail it (no network).
      - name: Test the fetcher
        run: |
          python scripts/test_fetch_new_zealand.py
          python scripts/test_market_top.py

      - name: Fetch & update the New Zealand CSVs
        id: fetch
        run: |
          python scripts/fetch_new_zealand.py \
            ${VARIANT:+--variant "$VARIANT"} \
            ${PERIOD:+--period "$PERIOD"} \
            ${SINCE:+--since "$SINCE"} \
            ${FORCE:+--force} \
            ${DRY_RUN:+--dry-run}
        env:
          VARIANT: ${{ inputs.variant }}
          PERIOD:  ${{ inputs.period }}
          SINCE:   ${{ inputs.since }}
          FORCE:   ${{ inputs.force == true && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}

      - name: Commit if changed
        id: commit
        if: inputs.dry_run != true
        uses: EndBug/add-and-commit@v9
        with:
          # The action splits `add` on whitespace, so the space in the file
          # name is matched with a pathspec glob.
          add: |
            data/New?Zealand*.csv
            market/new_zealand_top.json
          message: 'chore: update New Zealand data from NZTA Motor Vehicle Register'
          default_author: github_actions
          # Rebase over anything that landed while this job ran instead of
          # failing the push with non-fast-forward (same as fetch-spain.yml).
          pull: '--rebase --autostash'

  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.changed_variants != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for New Zealand
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.changed_variants }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country="New Zealand" \
            -f variants="$variants"
