name: Probe Nepal old FTS layouts (TEMPORARY)

# TEMPORARY: characterises the pre-2020 FTS workbook layouts for the backfill
# investigation. Writes a compact text report to scratch_nepal/ (no raw
# files). Removed once the backfill decision is made.

on:
  workflow_dispatch:
  push:
    branches: [claude/repo-inhalte-erweitern-lgthvs]
    paths:
      - 'scripts/probe_nepal_old.py'
      - '.github/workflows/probe-nepal-old.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests openpyxl
      - name: Probe
        run: python scripts/probe_nepal_old.py
      - name: Commit report
        uses: EndBug/add-and-commit@v9
        with:
          add: scratch_nepal/oldfmt_report.txt
          message: 'chore(nepal): old-layout probe report (temporary)'
          default_author: github_actions
          pull: '--rebase --autostash'
