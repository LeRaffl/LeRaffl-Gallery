name: Fetch Türkiye data (TÜİK)

# Reads a TÜİK "Motorlu Kara Taşıtları" monthly bulletin from the Veri Portalı
# and upserts the previous calendar month into data/Türkiye.csv. Runs daily
# from the 15th onward — the script self-throttles on the latest period already
# in the CSV, so most invocations are a no-op until the new bulletin appears
# (TÜİK publishes ~mid-month; the exact date is footnoted in the previous one).
#
# The bulletin id is discovered automatically: the Veri Portalı SPA is backed
# by a JSON API at /api/tr/press/<id> whose records carry `title` and `period`,
# and scripts/tuik_discover.py walks ids outward from the newest one recorded
# in the CSV to find the target month. No manual press_id dispatch is needed —
# the inputs below remain for backfills and for overriding a bad read.
#
# Set recon=true to dump a reconnaissance pass (SPA chunk crawl + endpoint
# probe) into the log; use it when the portal changes shape and discovery
# starts missing.
#
# Set dry_run=true with year+month to re-read a month that is already committed
# and print what the parser makes of it today without touching the CSV. That is
# the way to check a parser change against real bulletins rather than only
# against fixtures.
#
# When the CSV changes, render-country.yml is dispatched for Türkiye.

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Target year (leave empty for previous calendar month)'
        required: false
        default: ''
      month:
        description: 'Target month 1-12 (leave empty for previous calendar month)'
        required: false
        default: ''
      press_id:
        description: 'TÜİK bulletin Sayı (numeric id, e.g. 58042 for Nisan 2026)'
        required: false
        default: ''
      pdf_url:
        description: 'Direct press PDF URL (overrides press_id; leave empty to use press_id)'
        required: false
        default: ''
      force:
        description: 'Re-process even if target period already exists'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Parse and validate but write nothing (use with year/month to re-read a committed month)'
        required: false
        default: 'false'
        type: boolean
      no_ytd_check:
        description: 'Skip the year-to-date cross-check (only when TÜİK revised an already-committed month)'
        required: false
        default: 'false'
        type: boolean
      recon:
        description: 'Dump the portal reconnaissance pass when discovery finds nothing'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '30 8 15-31 * *'   # daily at 08:30 UTC, from the 15th onward (staggered to avoid 08:00 pile-up)

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system OCR + PDF tools
        # poppler-utils → pdfimages; tesseract-ocr-tur → Turkish language pack;
        # imagemagick → convert (used to upscale 4× before OCR).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-tur imagemagick

      - name: Install Python dependencies
        run: pip install requests pypdf cryptography

      # The parser's failure mode is a silently wrong number, so its regression
      # tests gate the fetch rather than trailing it. They need no network and
      # run in about a second; a red run here means do not trust today's read.
      - name: Test the fuel-table parser
        run: python scripts/test_fetch_turkey.py

      - name: Fetch & update Türkiye.csv
        run: |
          python scripts/fetch_turkey.py \
            ${YEAR:+--year "$YEAR"} \
            ${MONTH:+--month "$MONTH"} \
            ${PRESS_ID:+--press-id "$PRESS_ID"} \
            ${PDF_URL:+--pdf-url "$PDF_URL"} \
            ${FORCE:+--force} \
            ${DRY_RUN:+--dry-run} \
            ${NO_YTD_CHECK:+--no-ytd-check}
        env:
          YEAR: ${{ inputs.year }}
          MONTH: ${{ inputs.month }}
          PRESS_ID: ${{ inputs.press_id }}
          PDF_URL: ${{ inputs.pdf_url }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          NO_YTD_CHECK: ${{ inputs.no_ytd_check == true && '1' || '' }}
          TUIK_RECON: ${{ inputs.recon == true && '1' || '' }}

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: data/Türkiye.csv
          message: 'chore: update Türkiye data from TÜİK'
          default_author: github_actions

      - name: Trigger render for Türkiye
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run render-country.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f country=Türkiye \
            -f variant=Whole
