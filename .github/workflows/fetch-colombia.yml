name: Fetch Colombia data (ANDI/FENALCO Boletín)

# Fetches the joint FENALCO/ANDI monthly "Informe del Sector Automotor" PDF
# (linked from ANDI's Cámara Automotriz page) and upserts data/Colombia.csv.
# Underlying figures are sourced from RUNT (Colombia's official vehicle
# registry — the same registry behind ANDEMOS's gated dashboards, just
# delivered as a free public PDF here).
#
# Since Sept 2026 the Cámara page no longer links monthlies, so discovery also
# reads ANDI's press note for the month (PDF embedded there) and then tries the
# known /Uploads/ filename shapes. If no PDF for the month is reachable at all,
# the month is filled from FENALCO's public press text (fenalco.com.co/blog/
# gremial-4) — target month only, cross-checked against the previous month,
# flagged "fenalco press text - provisional …" in notes; daily runs keep
# looking for the PDF and the first bulletin that carries the month overwrites
# it. Once FENALCO lists the month, a month we still cannot ingest fails the
# run on any day; before that, a miss is quiet until day 20.
#
# Single variant (Whole = the bulletin's "vehículos nuevos" total: all new
# four-wheel vehicles incl. pick-ups, vans and commercial, not passenger cars
# only — see doc 18 § 3a). Colombia does not split PHEV vs HEV in this
# report — combined "híbridos" go in the HEV column ("single Hybrid bucket"
# convention shared with Türkiye and Georgia).
#
# Set dry_run=true to discover, download and parse the newest bulletin and
# print what would change — plus the full `pdftotext -layout` output — without
# writing the CSV. That is the way to check discovery or a parser change
# against the real PDF from a branch (the ANDI host is not reachable from
# every dev sandbox). The PDF and its text are also uploaded as a run
# artifact ("colombia-bulletin") for a week.
#
# See scripts/fetch_colombia.py and docs/architecture/18-source-colombia.md.

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'Override: fetch this specific PDF URL instead of auto-discovering.'
        required: false
        default: ''
        type: string
      force:
        description: 'Re-read the newest bulletin even if the previous month is already in the CSV.'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Parse and report only — write nothing, commit nothing; dumps the PDF text into the log.'
        required: false
        default: 'false'
        type: boolean
      dump_listing:
        description: 'Also report what the Cámara Automotriz page contains, into the log (for discovery work).'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # ANDI/FENALCO publishes the previous month's boletín somewhere in the
    # first ~3 weeks of each month. Poll daily 5th–25th at 07:30 UTC (free
    # slot); per-variant early-exit makes runs no-ops once the previous month
    # is in the CSV from a boletín (a provisional press-text row does not count).
    - cron: '30 7 5-25 * *'

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install requests

      - name: Fetch & update Colombia.csv
        run: |
          python scripts/fetch_colombia.py \
            ${PDF_URL:+--pdf-url "$PDF_URL"} \
            ${FORCE:+--force} \
            ${DRY_RUN:+--dry-run --dump-text} \
            ${DUMP_LISTING:+--dump-listing} \
            --debug-dir "$RUNNER_TEMP/colombia-bulletin"
        env:
          PDF_URL: ${{ inputs.pdf_url }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          DUMP_LISTING: ${{ inputs.dump_listing == true && '1' || '' }}

      - name: Upload bulletin PDF + text
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: colombia-bulletin
          path: ${{ runner.temp }}/colombia-bulletin
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit if changed
        id: commit
        if: ${{ inputs.dry_run != true }}
        uses: EndBug/add-and-commit@v10
        with:
          add: data/Colombia.csv
          message: 'chore: update Colombia data from ANDI/FENALCO (datos RUNT)'
          default_author: github_actions
          # Rebase over anything (manifest/source-page CI, another fetcher, a
          # doc push) that landed on the branch while this job ran, instead of
          # failing the push with non-fast-forward and dropping the commit.
          pull: '--rebase --autostash'

      - name: Trigger render
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run render-country.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f country=Colombia \
            -f variant=Whole
