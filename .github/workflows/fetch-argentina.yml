name: Fetch Argentina data (DNRPA)

# Fetches DNRPA's "Inscripciones iniciales de autos" open microdata (one
# record per first registration, datos.jus.gob.ar CKAN) and upserts the
# Argentina CSVs. One download feeds every variant:
#
#   data/Argentina.csv           Whole     passenger-car body types (≈ EU M1)
#   data/Argentina_Private.csv   Private   Whole ∧ natural-person first owner
#   data/Argentina_Industry.csv  Industry  Whole ∧ legal-person first owner
#   data/Argentina_Pickups.csv   Pickups   all PICK-UP body types
#
# The records carry no fuel field: the powertrain is classified from the
# model designation by a tested rule table (scripts/fetch_argentina.py,
# validated against ACARA's electrified totals). Full definitions, the
# validation and the caveats: docs/architecture/39-source-argentina.md.
#
# DNRPA uploads month M around the 11th of M+1 (2026-08 landed 2026-09-11,
# ~17:30 UTC). Polled twice daily on the 8th–25th; the script self-throttles
# via the CSVs, so once the month is in, runs are a no-op without any HTTP.
# Each real run re-derives the target year and the previous one from the
# yearly zips, so DNRPA's corrections land too (line-level upserts only).
#
# Rendering: dispatches render-country.yml ONCE with the pipe-separated list
# of touched variants (serial in one run, one commit — see fetch-spain.yml).

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to fetch (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - Whole
          - Private
          - Industry
          - Pickups
      period:
        description: 'Target month YYYY-MM (default: previous month)'
        required: false
        default: ''
      backfill:
        description: 'Re-derive every month from backfill_from'
        required: false
        default: false
        type: boolean
      backfill_from:
        description: 'Oldest month for the backfill'
        required: false
        default: '2018-01'
      force:
        description: 'Ignore the self-throttle / completeness guard / foreign rows'
        required: false
        default: false
        type: boolean
  schedule:
    # Twice daily on the 8th–25th, 09:15 and 21:15 UTC (the evening slot
    # catches a same-day afternoon upload in Buenos Aires, UTC−3).
    - cron: '15 9,21 8-25 * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      any_changed: ${{ steps.fetch.outputs.changed }}
      changed_variants: ${{ steps.fetch.outputs.changed_variants }}
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      # The classifier's failure mode is a silently wrong fuel split, so its
      # regression tests gate the fetch rather than trail it (no network).
      - name: Test the powertrain classifier
        run: python scripts/test_fetch_argentina.py

      - name: Fetch & update Argentina CSVs
        id: fetch
        run: |
          python scripts/fetch_argentina.py \
            ${VARIANT:+--variant "$VARIANT"} \
            ${PERIOD:+--period "$PERIOD"} \
            ${BACKFILL:+--backfill} \
            ${BACKFILL_FROM:+--backfill-from "$BACKFILL_FROM"} \
            ${FORCE:+--force}
        env:
          VARIANT:       ${{ inputs.variant }}
          PERIOD:        ${{ inputs.period }}
          BACKFILL:      ${{ inputs.backfill == true && '1' || '' }}
          BACKFILL_FROM: ${{ inputs.backfill_from }}
          FORCE:         ${{ inputs.force == true && '1' || '' }}

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Argentina.csv
            data/Argentina_Private.csv
            data/Argentina_Industry.csv
            data/Argentina_Pickups.csv
          message: 'chore: update Argentina data from DNRPA'
          default_author: github_actions
          # Rebase over anything that landed while this job ran instead of
          # failing the push with non-fast-forward (same as fetch-spain.yml).
          pull: '--rebase --autostash'

  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.changed_variants != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Argentina
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.changed_variants }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country=Argentina \
            -f variants="$variants"
