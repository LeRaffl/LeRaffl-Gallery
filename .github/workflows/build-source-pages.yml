name: Build source pages

# Regenerates the public country source pages (and explainer pages such as
# sources/tags.html, docs/architecture/61-tag-system.md) under sources/ whenever their
# inputs change: a source doc's front-matter, the stub registry, the generator
# itself, params.csv (which carries the latest period + TTM BEV share shown
# on each page), classification/** (Argentina's powertrain mapping + top
# models, docs/architecture/39-source-argentina.md §6) or market/** (the top
# brands/models summaries other fetchers write, scripts/market_top.py).
# Commits the regenerated HTML back to the branch.
#
# The generated HTML lives in the repo because GitHub Pages serves it directly,
# so it must be committed to go live. This workflow does NOT trigger on
# sources/** changes, so its own commit can't retrigger it.

on:
  push:
    branches: [master]
    paths:
      - 'docs/architecture/*-source-*.md'
      - 'docs/architecture/61-tag-system.md'   # explainer page sources/tags.html
      - 'docs/architecture/65-fleet-model.md'  # explainer page sources/fleet.html
      - 'docs/architecture/country_source_stubs.yaml'
      - 'docs/architecture/candidate_sources.yaml'
      - 'scripts/build_source_pages.py'
      - 'scripts/model_card.py'      # the model-card sections of each page
      - 'scripts/flyer.py'           # sources/flyer/<slug>.html
      - 'scripts/locator_map.py'
      - 'assets/maps/**'
      - 'reference/**'               # ACEA's EU shares on the EU brief
      - 'footnotes.csv'              # chart footnote repeated under Caveats
      - 'scripts/build_schedule.py'
      - 'scripts/build_updates.py'   # sources/updates.json (home "Latest updates")
      - 'scripts/build_theme.py'
      - 'index.html'                 # the palette's source of truth (#221)
      - 'params.csv'
      - 'manifest.json'
      - '.github/workflows/fetch-*.yml'
      - 'classification/**'          # powertrain mapping + top models (doc 39 §6)
      - 'market/**'                  # top brands/models (scripts/market_top.py)
  pull_request:
    paths:
      - 'docs/architecture/*-source-*.md'
      - 'docs/architecture/61-tag-system.md'   # explainer page sources/tags.html
      - 'docs/architecture/65-fleet-model.md'  # explainer page sources/fleet.html
      - 'docs/architecture/country_source_stubs.yaml'
      - 'docs/architecture/candidate_sources.yaml'
      - 'scripts/build_source_pages.py'
      - 'scripts/model_card.py'
      - 'scripts/flyer.py'
      - 'scripts/market_structure.py'  # brand block on the brief
      - 'scripts/social_card.py'       # social cards (sources/flyer/<slug>_social.html)
      - 'scripts/region_card.py'       # region briefs (sources/flyer/<slug>.html)
      - 'scripts/locator_map.py'       # locator map on briefs and cards
      - 'assets/maps/**'
      - 'reference/**'                 # ACEA's EU shares on the EU brief
      - 'footnotes.csv'
      - 'scripts/test_build_source_pages.py'
      - 'scripts/test_market_structure.py'
      - 'scripts/test_region_card.py'
      - 'scripts/test_locator_map.py'
      - 'scripts/build_schedule.py'
      - 'scripts/build_updates.py'
      - 'scripts/test_build_updates.py'
      - 'scripts/build_theme.py'
      - 'index.html'
      - 'classification/**'
      - 'market/**'
  workflow_dispatch: {}
  schedule:
    - cron: '37 4 * * *'   # daily fallback so freshness tracks the data

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read   # Release: lines of merged PRs for sources/updates.json
    concurrency:
      group: source-pages-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Full history, but no old file contents: the home page's "Latest
      # updates" feed (scripts/build_updates.py) reads the last 60 days of
      # data/*.csv diffs, and git fetches only those blobs on demand. PR runs
      # only test the generators, so they keep the default shallow clone.
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          filter: blob:none

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml segno==1.6.6   # segno: QR code on the country briefs

      # On pull requests, only validate the content model — never commit.
      - name: Validate front-matter + stubs
        if: github.event_name == 'pull_request'
        run: python3 scripts/build_source_pages.py --check

      - name: Generator tests (reconciliation section)
        if: github.event_name == 'pull_request'
        run: python3 scripts/test_build_source_pages.py

      - name: Latest-updates feed tests
        if: github.event_name == 'pull_request'
        run: python3 scripts/test_build_updates.py

      - name: Locator map tests
        if: github.event_name == 'pull_request'
        run: cd scripts && python3 test_locator_map.py

      # Includes the ACEA guard: reference/acea_eu_shares.csv (written by
      # fetch-acea.yml each month) may lag the EU data by at most
      # region_card.ACEA_MAX_LAG months (reference/SOURCES.md).
      - name: Region brief tests
        if: github.event_name == 'pull_request'
        run: cd scripts && python3 test_region_card.py

      # assets/theme.css is generated from index.html's :root block (#221), so
      # a palette change there must not leave the standalone pages behind.
      # --check fails the PR rather than silently serving a stale stylesheet.
      - name: Check theme is in sync with index.html
        if: github.event_name == 'pull_request'
        run: python3 scripts/build_theme.py --check

      - name: Build theme
        if: github.event_name != 'pull_request'
        run: python3 scripts/build_theme.py

      - name: Build source pages
        if: github.event_name != 'pull_request'
        run: python3 scripts/build_source_pages.py

      # Freshness data for the gallery's "Data freshness" tab. Depends on the
      # fetch workflows' crons and on manifest.json, hence the extra triggers.
      - name: Build schedule data
        if: github.event_name != 'pull_request'
        run: python3 scripts/build_schedule.py

      # "Latest updates" on the home page: content changes only (new months,
      # countries, series, columns, revisions from the data commits; the
      # Release: lines of merged PRs). Never fails the build: without gh it
      # keeps the previous feed's site entries. docs/architecture/66-latest-updates.md.
      - name: Build latest-updates feed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_updates.py || echo "::warning::build_updates.py failed; the home page keeps the previous feed."

      - name: Commit regenerated pages
        if: github.event_name != 'pull_request'
        uses: EndBug/add-and-commit@v10
        with:
          add: |
            sources
            assets/theme.css
          message: 'chore: rebuild source pages (CI)'
          default_author: github_actions
          # Rebase over anything (manifest/source-page CI, another fetcher, a
          # doc push) that landed on the branch while this job ran, instead of
          # failing the push with non-fast-forward and dropping the commit.
          pull: '--rebase --autostash'

      # Daily on master too: fails the run (after the pages are committed)
      # when ACEA's EU figure stopped updating, so it shows up before a
      # stale "Hybrids (HEV) · ACEA" line does.
      - name: ACEA EU figure is current
        if: github.event_name != 'pull_request'
        run: cd scripts && python3 region_card.py --check-acea
