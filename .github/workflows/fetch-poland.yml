name: Fetch Poland data (PZPM eRegistrations)

# Fetches new registrations from PZPM's monthly eRegistrations workbook (CEP)
# and upserts per-variant CSVs:
#   * Whole — OSOBOWE (passenger cars)                       -> auto-render
#   * Vans  — SAMOCHODY DOSTAWCZE (LCV <=3.5t)               -> auto-render
#   * HDV   — SAMOCHODY CIĘŻAROWE POW. 3,5T (trucks >3.5t)   -> auto-render
#   * Buses — AUTOBUSY                                       -> auto-render
#
# PZPM is the PRIMARY source for the Whole row (source := "PZPM"); it is the
# CEP-based upstream behind ACEA's Poland numbers. The tables now live on
# www1.pzpm.org.pl and discovery is two-level (landing page + per-month
# sub-pages); the reporting month is read from the workbook's "Ogółem" sheet,
# not the URL/filename (PZPM mislabels those). When a month is PDF-only (no xlsx
# table yet), this run is a clean no-op and ACEA (scripts/fetch_acea.py, Poland
# on its conditional list) fills that month as a fallback WITHOUT overwriting a
# PZPM row.
#
# Every variant whose CSV changed is dispatched to render-country.yml. The
# commercial variants used to be fetch-only because their history was thin
# ("started 2026"); they now run from 2021-07 (26 months through 2026-10),
# so that restriction no longer applies. The workbook still only carries the
# current month, which is why the CSVs must keep accumulating.
#
# See scripts/fetch_poland.py and docs/architecture/22-source-poland.md.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-fetch even if the latest period is already present'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  schedule:
    # PZPM publishes the previous month around the 7th. Poll on the 6th–10th at
    # 09:30 and 13:30 UTC; the per-variant early-exit makes runs no-ops once the
    # latest published month is in each CSV.
    - cron: '30 9 6-10 * *'
    - cron: '30 13 6-10 * *'

jobs:
  fetch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Fetch & update Poland CSVs (all variants)
        run: |
          python scripts/fetch_poland.py ${FORCE:+--force}
        env:
          FORCE: ${{ inputs.force == 'true' && '1' || '' }}

      - name: Detect which variants changed
        id: changed
        run: |
          touched=()
          for pair in "Whole:data/Poland.csv" \
                     "Vans:data/Poland_Vans.csv" \
                     "HDV:data/Poland_HDV.csv" \
                     "Buses:data/Poland_Buses.csv"; do
            variant="${pair%%:*}"
            file="${pair##*:}"
            [ -f "$file" ] || continue
            git add -N "$file" 2>/dev/null || true
            if ! git diff --quiet -- "$file"; then
              touched+=("$variant")
            fi
          done
          variants=$(IFS='|'; echo "${touched[*]}")
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "Touched variants: ${variants:-<none>}"

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v10
        with:
          add: |
            data/Poland.csv
            data/Poland_Vans.csv
            data/Poland_HDV.csv
            data/Poland_Buses.csv
          message: 'chore: update Poland data from PZPM (eRegistrations)'
          default_author: github_actions
          # Rebase over anything (manifest/source-page CI, another fetcher, a
          # doc push) that landed on the branch while this job ran, instead of
          # failing the push with non-fast-forward and dropping the commit.
          pull: '--rebase --autostash'

      - name: Trigger render for changed variants
        if: steps.commit.outputs.committed == 'true' && steps.changed.outputs.variants != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANTS: ${{ steps.changed.outputs.variants }}
        run: |
          if [ -z "$VARIANTS" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f country=Poland \
            -f variants="$VARIANTS"
