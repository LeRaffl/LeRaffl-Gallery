name: Fetch India data (Vahan) — probe

# Reachability/shape probe for the India (Vahan) sources. The maintainer's
# manual pulls needed a VPN, so whether GitHub runners can reach Vahan at
# all decides the fetcher design. No data is written yet.

on:
  workflow_dispatch:

# One run per fetcher at a time: a manual dispatch or a late cron tick
# queues behind a running fetch instead of racing it to the same CSVs.
# Not cancelled (a half-written fetch is worse than a wait).
concurrency:
  group: fetch-india
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Probe
        run: python scripts/fetch_india.py --probe
