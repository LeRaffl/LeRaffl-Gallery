name: Fetch India data (Vahan) — probe

# Reachability/shape probe for the India (Vahan) sources. The maintainer's
# manual pulls needed a VPN, so whether GitHub runners can reach Vahan at
# all decides the fetcher design. No data is written yet.

on:
  workflow_dispatch:
  # DEV: temporary trigger so the probe runs while the fetcher is developed
  # on the expansion branch; remove before merging.
  push:
    branches: [claude/portfolio-country-expansion-95a8bb]
    paths:
      - 'scripts/fetch_india.py'
      - '.github/workflows/fetch-india.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Probe
        run: python scripts/fetch_india.py --probe
