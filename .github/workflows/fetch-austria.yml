name: Fetch Austria data (Statistik Austria DE2 / DE3 / GE2)

# Fetches Statistik Austria's monthly cumulative ODS publications and upserts
# four per-variant CSVs:
#
#   * Whole — Pkw Klasse M1 (data/Austria.csv), from DE2 Tabelle 2 with the
#             "darunter Plug-In" rows that let us split PHEV vs HEV.
#   * HDV   — Lkw N2 + N3 + Sattelzugfahrzeuge (data/Austria_HDV.csv), from
#             DE3 vehicle-class × fuel matrix; PHEV blank, HEV holds combined
#             Plug-In + full hybrid (source lumps them at Lkw row level).
#   * Vans  — Lkw N1, ≤ 3.5 t (data/Austria_Vans.csv), same DE3 layout as HDV.
#   * Used  — Pkw used registrations / Gebrauchtzulassungen
#             (data/Austria_Used.csv), from GE2 Tabelle 2 on the
#             kfz-gebrauchtzulassungen listing page; same shape as DE2
#             incl. the Plug-In rows, so PHEV/HEV are split.
#
# See scripts/fetch_austria.py for the file URLs, label mappings, and the
# per-variant backfill envelope (HDV/Vans monthly only from 2025-01 onward;
# 2024 is annual; pre-2024 not published).
#
# Statistik Austria publishes the prior-month cumulative file around the
# 10th–14th of the month at 07–09 UTC (verified from last-modified headers).
# The 09:25 UTC schedule sits just after that window; per-variant early-exit
# in the script makes subsequent daily runs cheap no-ops.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to fetch (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - whole
          - hdv
          - vans
          - used
      year:
        description: 'Year to refetch (optional)'
        required: false
        type: string
      force:
        description: 'Skip the "already current" early-exit check'
        required: false
        default: false
        type: boolean
  schedule:
    # Daily 8th–22nd at 09:25 UTC. Window covers the typical mid-month
    # publication slot with buffer for early/late releases.
    - cron: '25 9 8-22 * *'

jobs:
  fetch:
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      variants_json: ${{ steps.changed.outputs.variants_json }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # requests[socks] so AUSTRIA_PROXY may be a socks5:// URL as well as http(s)://.
        run: pip install "requests[socks]"

      - name: Fetch & update Austria CSVs
        # Statistik Austria blocks GitHub's datacenter IPs. Requests are routed
        # through the Cloudflare Worker fetch relay (AUSTRIA_FETCH_RELAY, e.g.
        # https://<worker-host>/fetch?url=, gated by AUSTRIA_RELAY_TOKEN), which
        # egresses from a non-blocked IP. AUSTRIA_PROXY is an optional fallback
        # (a real http(s):///socks5:// proxy) if the relay egress is also
        # blocked. With none set the fetch fails fast with a clear message.
        run: |
          python scripts/fetch_austria.py \
            ${VARIANT:+--variant "$VARIANT"} \
            ${YEAR:+--year "$YEAR"} \
            ${FORCE:+--force}
        env:
          VARIANT: ${{ inputs.variant }}
          YEAR: ${{ inputs.year }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
          AUSTRIA_FETCH_RELAY: ${{ secrets.AUSTRIA_FETCH_RELAY }}
          AUSTRIA_RELAY_TOKEN: ${{ secrets.AUSTRIA_RELAY_TOKEN }}
          AUSTRIA_PROXY: ${{ secrets.AUSTRIA_PROXY }}

      - name: Detect which CSVs changed
        id: changed
        run: |
          touched=()
          for pair in "Whole:data/Austria.csv" \
                     "HDV:data/Austria_HDV.csv" \
                     "Vans:data/Austria_Vans.csv" \
                     "Used:data/Austria_Used.csv"; do
            variant="${pair%%:*}"
            file="${pair##*:}"
            [ -f "$file" ] || continue
            git add -N "$file" 2>/dev/null || true
            if ! git diff --quiet -- "$file"; then
              touched+=("$variant")
            fi
          done
          variants=$(IFS='|'; echo "${touched[*]}")
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          # JSON array for the serial render matrix below
          if [ ${#touched[@]} -eq 0 ]; then
            json="[]"
          else
            json=$(printf '"%s",' "${touched[@]}"); json="[${json%,}]"
          fi
          echo "variants_json=$json" >> "$GITHUB_OUTPUT"
          echo "Touched variants: ${variants:-<none>}"

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Austria.csv
            data/Austria_HDV.csv
            data/Austria_Vans.csv
            data/Austria_Used.csv
          message: 'chore: update Austria data from Statistik Austria (DE2/DE3/GE2)'
          default_author: github_actions

  # Render the touched variants as ONE top-level "Render: Austria" run in the
  # Render-country-charts workflow, so it shows up in that workflow's own
  # history (scannable from the mobile GitHub app) instead of a matrix nested
  # inside this fetcher's run. We dispatch render-country.yml ONCE with the
  # pipe-joined variant list; it renders them serially in a single job and
  # commits once — so unlike the abandoned per-variant `gh workflow run`
  # fan-out (parallel renders that raced on params.csv/weights.csv), there is
  # only one render run and nothing races.
  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.variants_json != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Austria
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.variants_json }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country=Austria \
            -f variants="$variants"
