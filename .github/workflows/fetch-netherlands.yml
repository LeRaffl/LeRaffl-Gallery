name: Fetch Netherlands data (RDW via Swing)

# Fetches three workspace pivots from duurzamemobiliteit.databank.nl (RDW data
# served via the Swing 7.1 BI platform) and upserts new monthly rows into
# data/Netherlands.csv for three variants:
#
#   * Whole         — Instroom Personenauto Nieuw
#   * Used Imports  — Instroom Personenauto Occasion import (>90 + <=90 dgn)
#   * HDV           — Instroom Zware bedrijfsvoertuigen Nieuw
#
# Each variant is fetched from a pre-saved Swing workspace template (configured
# in the Swing UI via the share-icon → permalink mechanism). See the docstring
# in scripts/fetch_netherlands.py for details. If the CSV changed, this workflow
# renders touched variants via a serial render-country.yml matrix.
#
# Top brands/models: the same script also keeps market/netherlands_top.json
# (trailing-12-month top BEV / PHEV brands and models, Whole) and its month
# store market/netherlands_months.json current from the RDW open-data register
# (opendata.rdw.nl — a plain host, unlike the Swing portal, so no relay). It
# is committed with the data but never triggers a render; the source page picks
# it up through build-source-pages.yml. The very first run reads twelve months
# (about 15 minutes), later runs one.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to fetch (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - whole
          - used
          - hdv
      probe:
        description: 'Diagnose the Swing viewer (prints how a workspace is opened; writes nothing)'
        required: false
        default: false
        type: boolean
      probe_grep:
        description: 'probe: regexes to show the bundle code around (separated by ||)'
        required: false
        default: ''
        type: string
      probe_get:
        description: 'probe: API paths to GET through the relay ({ws} = session workspace id; space separated)'
        required: false
        default: ''
        type: string
  schedule:
    # Daily 1st–15th at 06:30 UTC. RDW's publication date varies (sometime in
    # the first half of the following month), so we poll daily until the
    # previous month's row materialises in the CSV, then idempotent re-fetches
    # produce no diff (no commit, no render trigger). 06:30 UTC keeps us clear
    # of fetch-brazil's 08:00 UTC slot and most country-side timezones.
    - cron: '30 6 1-15 * *'

jobs:
  fetch:
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      variants_json: ${{ steps.changed.outputs.variants_json }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # requests[socks] so NL_PROXY may be a socks5:// URL as well as http(s)://.
        run: pip install "requests[socks]"

      # Offline; guards the top brands/models builder (scripts/market_top.py)
      # and the RDW classification / display names.
      - name: Test the top brands/models builder
        run: python scripts/test_market_top.py

      - name: Fetch & update Netherlands.csv
        run: |
          python scripts/fetch_netherlands.py \
            ${PROBE:+--probe-swing} \
            ${VARIANT:+--variant "$VARIANT"}
        env:
          VARIANT: ${{ inputs.variant }}
          PROBE: ${{ inputs.probe && '1' || '' }}
          PROBE_GREP: ${{ inputs.probe_grep }}
          PROBE_GET: ${{ inputs.probe_get }}
          # NL-specific relay (Deno Deploy, see worker/deno-relay.ts) preferred;
          # falls back to the Austria CF relay — which duurzamemobiliteit
          # 403s, so set NL_FETCH_RELAY/NL_RELAY_TOKEN for this to work.
          NL_PROXY: ${{ secrets.NL_PROXY || secrets.AUSTRIA_PROXY }}
          NL_FETCH_RELAY: ${{ secrets.NL_FETCH_RELAY || secrets.AUSTRIA_FETCH_RELAY }}
          NL_RELAY_TOKEN: ${{ secrets.NL_RELAY_TOKEN || secrets.AUSTRIA_RELAY_TOKEN }}

      - name: Detect which CSVs changed
        id: changed
        run: |
          # For each of the 3 per-variant CSVs, check if git sees changes.
          # `git add -N` makes `git diff` include untracked new files (needed
          # the very first time each file is created). Emit a pipe-separated
          # list of variant names so we trigger render only for those.
          touched=()
          for pair in "Whole:data/Netherlands.csv" \
                     "Used:data/Netherlands_Used.csv" \
                     "HDV:data/Netherlands_HDV.csv"; do
            variant="${pair%%:*}"
            file="${pair##*:}"
            [ -f "$file" ] || continue
            git add -N "$file" 2>/dev/null || true
            if ! git diff --quiet -- "$file"; then
              touched+=("$variant")
            fi
          done
          variants=$(IFS='|'; echo "${touched[*]}")
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          # JSON array for the serial render matrix below
          if [ ${#touched[@]} -eq 0 ]; then
            json="[]"
          else
            json=$(printf '"%s",' "${touched[@]}"); json="[${json%,}]"
          fi
          echo "variants_json=$json" >> "$GITHUB_OUTPUT"
          echo "Touched variants: ${variants:-<none>}"

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Netherlands.csv
            data/Netherlands_Used.csv
            data/Netherlands_HDV.csv
            market/netherlands_top.json
            market/netherlands_months.json
          message: 'chore: update Netherlands data from duurzamemobiliteit.databank.nl'
          default_author: github_actions
          # Rebase over anything (manifest/source-page CI, another fetcher, a
          # doc push) that landed on the branch while this job ran, instead of
          # failing the push with non-fast-forward and dropping the commit.
          pull: '--rebase --autostash'

  # Render the touched variants as ONE top-level "Render: Netherlands" run in the
  # Render-country-charts workflow, so it shows up in that workflow's own
  # history (scannable from the mobile GitHub app) instead of a matrix nested
  # inside this fetcher's run. We dispatch render-country.yml ONCE with the
  # pipe-joined variant list; it renders them serially in a single job and
  # commits once — so unlike the abandoned per-variant `gh workflow run`
  # fan-out (parallel renders that raced on params.csv/weights.csv), there is
  # only one render run and nothing races.
  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.variants_json != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Netherlands
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.variants_json }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country=Netherlands \
            -f variants="$variants"
