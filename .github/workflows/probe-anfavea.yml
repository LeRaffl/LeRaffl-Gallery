name: TEMP probe ANFAVEA site

# Temporary diagnostic (removed before merge): dumps the new ANFAVEA
# Excel page and the structure of every linked workbook.

on:
  push:
    branches: [claude/anfavea-brazil-website-kkfb8n]
    paths: [.github/workflows/probe-anfavea.yml, scripts/fetch_brazil.py]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/test_fetch_brazil.py
      - run: |
          cp data/Brazil.csv /tmp/b.csv
          python scripts/fetch_brazil.py --csv /tmp/b.csv
          diff data/Brazil.csv /tmp/b.csv || true
          cp data/Brazil.csv /tmp/c.csv
          python scripts/fetch_brazil.py --year 2025 --csv /tmp/c.csv
          diff data/Brazil.csv /tmp/c.csv || true
