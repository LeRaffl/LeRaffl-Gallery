name: Fetch Nepal data (Department of Customs FTS)

# Fetches the Department of Customs' cumulative monthly Foreign Trade
# Statistics workbooks (customs.gov.np, sheet 5_Imports_By_Commodity),
# rebuilds every month of the processed fiscal year from consecutive-file
# deltas (HS 8703 split: BEV / Hybrid / Petrol / Diesel / Others), and
# upserts data/Nepal.csv (Whole = cars/jeeps/vans) plus
# data/Nepal_3-Wheelers.csv (auto- & e-rickshaws).
#
# Figures are imports, not registrations (Nepal imports its entire vehicle
# market). Hybrids use the single "Hybrid bucket" convention. See
# scripts/fetch_nepal.py and docs/architecture/32-source-nepal.md.

on:
  workflow_dispatch:
    inputs:
      fy:
        description: 'Process one BS fiscal start year (e.g. 2081). Empty = newest FY.'
        required: false
        default: ''
        type: string
      backfill:
        description: 'Process every fiscal year discoverable on the site.'
        required: false
        default: false
        type: boolean
  schedule:
    # DoC publishes each Nepali month's cumulative workbook a few weeks
    # after the month ends (Nepali months end mid-Gregorian-month, but the
    # publication day is irregular). Poll daily at 07:50 UTC — the fetcher
    # skips cheaply when the CSV already has every published month, and the
    # commit step is change-gated, so steady-state runs are no-ops.
    - cron: '50 7 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Fetch & update Nepal CSVs
        run: |
          python scripts/fetch_nepal.py ${FY:+--fy "$FY"} ${BACKFILL:+--backfill}
        env:
          FY: ${{ inputs.fy }}
          BACKFILL: ${{ inputs.backfill == true && '1' || '' }}

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Nepal.csv
            data/Nepal_3-Wheelers.csv
          message: 'chore: update Nepal data from customs.gov.np (FTS)'
          default_author: github_actions
          pull: '--rebase --autostash'

  # Render both Nepal variants as ONE top-level "Render: Nepal" run in the
  # Render-country-charts workflow (visible in its own history, scannable from
  # the mobile GitHub app) instead of a matrix nested inside this fetcher's run.
  # render-country.yml renders Whole then 3-Wheelers serially in a single job
  # and commits once, so the two variants never race on the shared
  # params.csv/weights.csv commit (the reason the old design serialised them).
  # As before, both variants render whenever anything committed.
  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Nepal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country=Nepal \
            -f variants="Whole|3-Wheelers"
