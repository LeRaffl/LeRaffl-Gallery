name: Probe Ukraine (temporary)

# Temporary: runs the real Ukraine fetcher (backfill) on the development
# branch, because fetch-ukraine.yml cannot be dispatched before it exists on
# master. Removed before merge.

on:
  push:
    branches: [claude/gallery-argentina-expansion-8la8aj]
    paths: [scripts/fetch_ukraine.py, .github/workflows/probe-ukraine.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: |
          python scripts/test_fetch_ukraine.py
          python scripts/test_market_top.py
      - run: python scripts/fetch_ukraine.py --backfill --period 2026-08
      - name: Commit data
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Ukraine.csv
            data/Ukraine_Private.csv
            data/Ukraine_Industry.csv
            data/Ukraine_Used.csv
            data/Ukraine_Vans.csv
            market/ukraine_top.json
          message: 'chore: update Ukraine data from MIA register (data.gov.ua)'
          default_author: github_actions
          pull: '--rebase --autostash'
