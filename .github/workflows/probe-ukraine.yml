name: Probe Ukraine (temporary)

# Temporary source probe for Ukraine (data.gov.ua MIA registrations).
# Runs on pushes to the development branch only; removed before merge.

on:
  push:
    branches: [claude/gallery-argentina-expansion-8la8aj]
    paths: [scripts/probe_ukraine.py, .github/workflows/probe-ukraine.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/probe_ukraine.py
      - name: Commit probe output
        uses: EndBug/add-and-commit@v9
        with:
          add: probe_out
          message: 'chore: Ukraine probe output (temporary)'
          default_author: github_actions
          pull: '--rebase --autostash'
