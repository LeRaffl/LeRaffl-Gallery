name: probe-artifact
on:
  push:
    branches: [claude/paraguay-probe]
    paths: [.github/workflows/probe-artifact.yml]
jobs:
  grab:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Download the preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p probe_out/preview
          gh run download 37120009847 -R "$GITHUB_REPOSITORY" -n render-preview -D probe_out/preview
          find probe_out/preview -type f | head -100
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f probe_out/preview
          git commit -m "probe output: preview PNGs" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
