name: Probe Nepal sources (TEMPORARY)

# TEMPORARY scaffolding for building the Nepal fetcher. Downloads the URLs
# listed in scratch_nepal/probe_urls.txt from a runner (open egress) and
# commits the responses to scratch_nepal/dl/ on this branch so the parser can
# be developed locally against real files. Push-triggered on the dev branch
# (same pattern as the India/Morocco probes); this workflow, the probe script
# and scratch_nepal/ are deleted before the integration is merged.

on:
  workflow_dispatch:
  # DEV: temporary trigger so the probe runs while the fetcher is developed
  # on this branch; removed before merging. The paths filter excludes
  # scratch_nepal/dl/, so the probe's own commit does not retrigger it.
  push:
    branches: [claude/repo-inhalte-erweitern-lgthvs]
    paths:
      - 'scripts/probe_nepal.py'
      - '.github/workflows/probe-nepal.yml'
      - 'scratch_nepal/probe_urls.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Probe
        run: python scripts/probe_nepal.py --urls-file scratch_nepal/probe_urls.txt

      - name: Commit scratch files
        uses: EndBug/add-and-commit@v9
        with:
          add: scratch_nepal/dl
          message: 'chore(nepal): probe scratch files (temporary, removed before merge)'
          default_author: github_actions
          pull: '--rebase --autostash'
