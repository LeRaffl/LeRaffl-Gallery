name: Fetch Brazil data (ANFAVEA)

# Queries ANFAVEA's "Central de Dados" (admin-ajax.php, since the 2026-09 site
# relaunch replaced the yearly Excel workbooks) for registrations of cars +
# light commercial vehicles by fuel, and upserts the monthly rows into
# data/Brazil.csv. If the CSV changed, render-country.yml is triggered
# automatically for Brazil.

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to fetch, Jan–Dec (leave empty for the running year)'
        required: false
        default: ''
      from:
        description: 'First month YYYY-MM (overrides year; leave empty for default)'
        required: false
        default: ''
      to:
        description: 'Last month YYYY-MM (overrides year; leave empty for default)'
        required: false
        default: ''
  schedule:
    - cron: '50 8 10 * *'   # 10th of each month at 08:50 UTC (staggered to avoid 08:00 pile-up)

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Parser self-test
        run: python scripts/test_fetch_brazil.py

      - name: Fetch & update Brazil.csv
        run: |
          python scripts/fetch_brazil.py \
            ${YEAR:+--year "$YEAR"} \
            ${FROM:+--from "$FROM"} \
            ${TO:+--to "$TO"}
        env:
          YEAR: ${{ inputs.year }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: data/Brazil.csv
          message: 'chore: update Brazil data from ANFAVEA'
          default_author: github_actions
          # Rebase over anything (manifest/source-page CI, another fetcher, a
          # doc push) that landed on the branch while this job ran, instead of
          # failing the push with non-fast-forward and dropping the commit.
          pull: '--rebase --autostash'

      - name: Trigger render for Brazil
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run render-country.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f country=Brazil \
            -f variant=Whole
