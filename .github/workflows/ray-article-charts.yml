name: Ray article charts

# Regenerates exports/ray_article/*.png from the current params.csv,
# weights.csv and data/ CSVs. Run manually after data updates land
# (e.g. once the June numbers / the Thailand backfill are in).

on:
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read   # pull the R image from GHCR
    # R + packages come from the prebuilt image (was r-lib/actions setup-r +
    # setup-r-dependencies). Contents, adding a package, rollback:
    # docs/architecture/63-r-render-image.md.
    container:
      image: ghcr.io/leraffl/r-render:v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Container jobs default to `sh`; keep the runner's default `bash -e`.
    defaults:
      run:
        shell: bash -e {0}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Render charts
        run: Rscript scripts/ray_domestic_bev_chart.R

      - name: Commit updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/ray_article
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(ray-article): regenerate charts"
          git push
