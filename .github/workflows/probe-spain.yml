name: Probe Spain data (DGT microdata)

# INVESTIGATION workflow — manual dispatch only, never writes to data/.
#
# Runs scripts/probe_spain_dgt.py from a GitHub Actions runner (which, unlike
# the Claude sandbox, can reach dgt.es) to answer the questions blocking a
# real fetch_spain.py:
#
#   1. Does the monthly matriculaciones microdata zip download anonymously,
#      and from which URL pattern?
#   2. Can the MATRICULACIONES_MATRABA.pdf record design be auto-parsed into
#      a fixed-width layout?
#   3. How close do DGT-derived fuel splits land to the ACEA rows already in
#      data/Spain.csv (three candidate market filters are compared)?
#   4. What would HDV / Vans / Buses / Used-imports / Rental variants look
#      like (homologation-category, nuevo/usado and servicio distributions)?
#
# The Markdown report lands in the job summary; raw diagnostics (design-PDF
# text dump, field table, sample records) are uploaded as an artifact.
#
# See docs/architecture/28-source-spain.md for the investigation context and
# what to do with the results.

on:
  workflow_dispatch:
    inputs:
      periods:
        description: 'Months to probe, space-separated YYYY-MM (pick months that already have an ACEA row in data/Spain.csv)'
        required: false
        default: '2026-04 2026-05'
      zip_url:
        description: 'Direct microdata zip URL (overrides the candidate patterns; single-period runs only)'
        required: false
        default: ''
      design_pdf:
        description: 'MATRICULACIONES_MATRABA.pdf URL override'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poppler (pdftotext) + requests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          pip install requests

      - name: Run probe
        run: |
          period_flags=""
          for p in $PERIODS; do period_flags="$period_flags --period $p"; done
          python scripts/probe_spain_dgt.py $period_flags \
            ${ZIP_URL:+--zip-url "$ZIP_URL"} \
            ${DESIGN_PDF:+--design-pdf "$DESIGN_PDF"} \
            --report-dir probe_report
        env:
          PERIODS:    ${{ inputs.periods }}
          ZIP_URL:    ${{ inputs.zip_url }}
          DESIGN_PDF: ${{ inputs.design_pdf }}

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f probe_report/report.md ]; then
            cat probe_report/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — check the probe step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spain-dgt-probe
          path: probe_report/
          if-no-files-found: warn
          retention-days: 30
