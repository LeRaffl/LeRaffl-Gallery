name: Fetch Israel data (data.gov.il)

# Aggregates monthly new passenger-car registrations by fuel type from the
# Ministry of Transport's open vehicle registry on data.gov.il (CKAN
# datastore) and upserts data/Israel.csv. The registry snapshot updates
# daily; the previous month is effectively complete within the first days
# of the following month. The script self-throttles (early-exit once the
# previous month is present), so the daily cron is a no-op most of the
# month; real runs re-count the last 3 months to absorb late registrations.
#
# See docs/architecture/30-source-israel.md for the source playbook
# (unpadded month keys, P-scope, the HEV-hidden-in-petrol catalogue join).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = dump datastore schema/cross-tabs only; fetch = update CSV'
        required: false
        default: 'fetch'
        type: choice
        options: [fetch, probe]
      start:
        description: 'First month to (re-)count (YYYY-MM; empty = last 3 months)'
        required: false
      end:
        description: 'Last month to (re-)count (YYYY-MM; empty = last 3 months)'
        required: false
      force:
        description: 'Re-count even if previous month already exists'
        required: false
        default: 'false'
        type: boolean

  schedule:
    - cron: '0 8 10-20 * *'   # daily at 08:00 UTC on the 10th-20th

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetcher
        run: |
          if [ "${{ inputs.mode }}" = "probe" ]; then
            python scripts/fetch_israel.py --probe
          else
            ARGS=""
            if [ -n "${{ inputs.start }}" ]; then ARGS="$ARGS --start ${{ inputs.start }}"; fi
            if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
            python scripts/fetch_israel.py $ARGS
          fi

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: data/Israel.csv
          message: 'chore: update Israel data from data.gov.il'
          default_author: github_actions

      - name: Trigger render for Israel
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run render-country.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f country=Israel \
            -f variant=Whole
