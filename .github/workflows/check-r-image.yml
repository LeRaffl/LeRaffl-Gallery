name: Check R image usage

# Every R step runs in the prebuilt image ghcr.io/leraffl/r-render
# (docs/architecture/63-r-render-image.md). This fails a PR that
#   * brings back r-lib/actions (setup-r / setup-r-dependencies) in a workflow,
#   * pins a different image tag than docker/r-render/IMAGE_VERSION, or
#   * changes docker/r-render/ without bumping IMAGE_VERSION.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docker/r-render/**'
      - 'scripts/check_r_image.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'docker/r-render/**'
      - 'scripts/check_r_image.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python3 scripts/check_r_image.py ${BASE:+--base "$BASE"}
