name: Monthly release stand

# On the 1st at 06:00 UTC, tag the month that just ended and publish the note.
# A manual run prints the note and does not publish unless publish is true.
# This does not mint a DOI. Zenodo does that once the repo is connected there.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release. Leave false to only print the note.'
        type: boolean
        default: false
      month:
        description: 'Stand month YYYY-MM. Empty uses the previous month on the 1st, otherwise the current month.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: read

jobs:
  stand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Choose the stand month
        id: month
        run: |
          set -euo pipefail
          MONTH="${{ inputs.month }}"
          if [ -z "$MONTH" ]; then
            if [ "$(date -u +%d)" = "01" ]; then
              MONTH=$(date -u -d 'yesterday' +%Y-%m)
            else
              MONTH=$(date -u +%Y-%m)
            fi
          fi
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          echo "tag=v$MONTH" >> "$GITHUB_OUTPUT"

      - name: Build the note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/build_release_note.py \
            --month "${{ steps.month.outputs.month }}" \
            --write "$RUNNER_TEMP/notes.md" \
            --citation-out "$RUNNER_TEMP/CITATION.cff" \
            --released "$(date -u +%F)"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.month.outputs.tag }}"
          if [ "${{ github.ref_name }}" != "master" ]; then
            echo "refusing to publish from ${{ github.ref_name }}"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          cp "$RUNNER_TEMP/CITATION.cff" CITATION.cff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          if ! git diff --cached --quiet; then
            git commit -m "chore: cite $TAG"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
