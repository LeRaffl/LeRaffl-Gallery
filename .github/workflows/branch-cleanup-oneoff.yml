# One-off branch cleanup, 2026-07-09. Deletes remote branches whose PRs are
# merged (or closed as superseded/unnecessary — verified individually).
# Kept branches: master, claude/netherlands-ip-relay (open PR #121),
# submit/australia-whole-20260703213129 (open PR #140).
# This file is removed again in the follow-up commit on the same branch.
name: Branch cleanup (one-off)

on:
  push:
    branches: [claude/repo-branch-cleanup-g885d8]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          branches=(
            backfill/italy-rental-nonrental-20260606
            claude/austria-data-fetch-error-5We96
            claude/china-bev-discrepancy-dukkw
            claude/feedback-image-upload
            claude/finland-data-pull-crash-6uaigu
            claude/luxembourg-data-pull-crash
            claude/no-transition-ttm-bev-threshold
            claude/poland-fetch-timeout-k1tk9x
            claude/poland-uruguay-fix
            claude/singapore-fetch
            claude/spain-data-automation-9jml5p
            claude/uk-data-validation-xVmo8
            claude/uruguay-data-quality-0ttfsi
            docs/italy-estimated-history
            estimate/italy-rental-history-pre2019
            feat/about-articles-link
            feat/about-landing-page
            feat/albania-dpshtrr
            feat/albania-per-variant-csv
            feat/luxembourg-lustat
            feat/malaysia-data-gov-my
            feat/poland-pzpm
            feat/ray-article-exports
            feat/schedule-calendar
            fix/about-articles-link
            fix/acea-parse-via-text
            fix/canada-quarterly-post-text
            fix/chile-narrative-fallback
            fix/chile-parse-debug
            fix/chile-parser-labels
            fix/colombia-hybrid-label
            fix/no-transition-tag-blank-ttm
            submit/australia-whole-20260605163347
            submit/australia-whole-20260708043839
            submit/germany-whole-20260703213533
            submit/new-zealand-whole-20260605165707
            submit/new-zealand-whole-20260708062536
            submit/thailand-whole-20260606091345
            submit/uk-whole-20260604164345
            submit/uk-whole-20260707041057
          )
          fail=0
          for b in "${branches[@]}"; do
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$b" >/dev/null 2>&1; then
              echo "deleted  $b"
            else
              echo "FAILED   $b"
              fail=1
            fi
          done
          exit $fail
