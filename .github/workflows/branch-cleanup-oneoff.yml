# One-off cleanup, round 2 (2026-07-09): deletes the branch of PR #140,
# which was closed as an erroneous data submission.
# This file is removed again in the follow-up commit on the same branch.
name: Branch cleanup (one-off)

on:
  push:
    branches: [claude/repo-branch-cleanup-g885d8]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/submit/australia-whole-20260703213129"
