name: Build manifest

on:
  push:
    branches: [master]              # manifest + schedule beschreiben master; kein Bot-Commit auf Feature-Branches (#243)
    paths:
      - 'images/**'                 # triggert bei neuen/gelöschten/verschobenen Dateien in images/
      - 'build_manifest.R'          # falls du den Builder änderst
      - 'R/render_schedule.R'       # falls der Schedule-Renderer geändert wird
      - '.github/workflows/fetch-*.yml'  # cron-Änderungen → Kalender neu bauen
  workflow_dispatch: {}             # optional: manuell auslösbar
  schedule:
    - cron: '17 3 * * *'            # optional: einmal täglich als Fallback (03:17 UTC)

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write               # erlaubt das Committen von manifest.json
      actions: write                # dispatch build-source-pages.yml after the commit
      packages: read                # pull the R image from GHCR
    # R + packages come from the prebuilt image (was r-lib/actions setup-r +
    # setup-r-dependencies). Contents, adding a package, rollback:
    # docs/architecture/63-r-render-image.md.
    container:
      image: ghcr.io/leraffl/r-render:v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Container jobs default to `sh`; keep the runner's default `bash -e`.
    defaults:
      run:
        shell: bash -e {0}
    concurrency:
      group: manifest-${{ github.ref }}
      cancel-in-progress: true      # vermeidet parallele Läufe bei vielen kleinen Pushes
    steps:
      - uses: actions/checkout@v5

      - name: Build manifest
        run: |
          Rscript -e "source('build_manifest.R'); build_manifest(root='images', base_url='images/')"

      - name: Render schedule
        run: |
          Rscript -e "source('R/render_schedule.R'); build_schedule()"

      - name: Commit manifest + schedule
        uses: EndBug/add-and-commit@v10
        with:
          add: |
            manifest.json
            schedule.html
            schedule-*.html
            schedule.ics
          message: "chore: update manifest + schedule (CI)"
          # Rebase onto the remote tip before pushing so a concurrent push
          # (e.g. a data-fetch job committing at the same time) doesn't reject
          # this one with a non-fast-forward error.
          pull: '--rebase --autostash'

      # Build source pages reads what a render writes: the fitted curve from
      # params.csv and bands/ (country briefs, sources/flyer/<slug>.html) and
      # the newest charts from manifest.json (source pages). Commits pushed
      # with GITHUB_TOKEN fire no push triggers, so without this dispatch both
      # would show last month until the daily 04:37 UTC run. Dispatched here,
      # after the manifest commit has landed, so that build sees the new
      # manifest.json too. Master only: no bot commits on feature branches
      # (#243). Build source pages has its own concurrency group, which
      # coalesces a burst of these (the ACEA fan-out) into one final build.
      - name: Trigger source pages build
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-source-pages.yml --ref "${GITHUB_REF_NAME}" \
            || echo "::warning::Could not dispatch build-source-pages.yml; the daily 04:37 UTC run will pick the briefs up."
