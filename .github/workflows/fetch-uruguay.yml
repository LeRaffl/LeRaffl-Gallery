name: Fetch Uruguay data (ACAU)

# Scrapes the latest ACAU "Compilado <year>" xlsx and upserts new months into
# the per-variant CSVs (Whole/Vans/HDV/Buses). Runs daily from the 1st of each
# month — the script self-throttles via the latest period already present
# in each CSV, so most invocations are a no-op until ACAU publishes the
# previous month's data inside the Compilado workbook.
# When any CSV changes, the changed variants render via a serial render-country.yml matrix.

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Compilado year (leave empty for the year of the previous calendar month)'
        required: false
        default: ''
      url:
        description: 'Direct Compilado xlsx URL or local path (leave empty to auto-discover)'
        required: false
        default: ''
      variant:
        description: 'Variant to fetch (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - whole
          - vans
          - hdv
          - buses
      force:
        description: 'Re-process months that already exist in the CSV'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '10 8 1-31 * *'   # daily at 08:10 UTC, from the 1st onward (staggered to avoid 08:00 pile-up)

jobs:
  fetch:
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      variants_json: ${{ steps.changed.outputs.variants_json }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl

      - name: Fetch & update Uruguay CSVs
        run: |
          python scripts/fetch_uruguay.py \
            ${YEAR:+--year "$YEAR"} \
            ${URL:+--url "$URL"} \
            ${VARIANT:+--variant "$VARIANT"} \
            ${FORCE:+--force}
        env:
          YEAR: ${{ inputs.year }}
          URL: ${{ inputs.url }}
          VARIANT: ${{ inputs.variant }}
          FORCE: ${{ inputs.force == true && '1' || '' }}

      - name: Detect which CSVs changed
        id: changed
        run: |
          # Capture per-variant change state before the commit so render dispatch
          # is independent of what add-and-commit chooses to include. Uses the
          # same git add -N + git diff pattern as fetch-netherlands.yml.
          touched=()
          for pair in "Whole:data/Uruguay.csv" \
                     "Vans:data/Uruguay_Vans.csv" \
                     "HDV:data/Uruguay_HDV.csv" \
                     "Buses:data/Uruguay_Buses.csv"; do
            variant="${pair%%:*}"
            file="${pair##*:}"
            [ -f "$file" ] || continue
            git add -N "$file" 2>/dev/null || true
            if ! git diff --quiet -- "$file"; then
              touched+=("$variant")
            fi
          done
          variants=$(IFS='|'; echo "${touched[*]}")
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          # JSON array for the serial render matrix below
          if [ ${#touched[@]} -eq 0 ]; then
            json="[]"
          else
            json=$(printf '"%s",' "${touched[@]}"); json="[${json%,}]"
          fi
          echo "variants_json=$json" >> "$GITHUB_OUTPUT"
          echo "Touched variants: ${variants:-<none>}"

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            data/Uruguay.csv
            data/Uruguay_Vans.csv
            data/Uruguay_HDV.csv
            data/Uruguay_Buses.csv
          message: 'chore: update Uruguay data from ACAU'
          default_author: github_actions

  # Render the touched variants as ONE top-level "Render: Uruguay" run in the
  # Render-country-charts workflow, so it shows up in that workflow's own
  # history (scannable from the mobile GitHub app) instead of a matrix nested
  # inside this fetcher's run. We dispatch render-country.yml ONCE with the
  # pipe-joined variant list; it renders them serially in a single job and
  # commits once — so unlike the abandoned per-variant `gh workflow run`
  # fan-out (parallel renders that raced on params.csv/weights.csv), there is
  # only one render run and nothing races.
  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.variants_json != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Uruguay
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.variants_json }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country=Uruguay \
            -f variants="$variants"
