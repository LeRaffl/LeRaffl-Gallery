name: Fetch Uruguay data (ACAU)

# TEMPORARILY converted into a dry-run test on this branch: runs the fixed
# parser against the snapshotted July 2026 workbook (debug_acau/) and prints
# the resulting CSV diff without committing. Will be restored before merge.

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openpyxl

      - name: Dry-run parser against snapshot workbook
        run: |
          python scripts/fetch_uruguay.py \
            --url debug_acau/Compilado_2026.xlsx --year 2026
          echo "=== git diff --stat ==="
          git diff --stat
          echo "=== per-CSV tails ==="
          for f in data/Uruguay.csv data/Uruguay_Vans.csv data/Uruguay_HDV.csv data/Uruguay_Buses.csv; do
            echo "--- $f"
            tail -3 "$f"
          done
