name: Fetch Thailand data (TAI/AIU portal)

# Fetches Thailand new-vehicle registrations by fuel type from the AIU member
# portal's JSON API (taiapi.thaiauto.or.th:3000) and upserts new monthly rows
# into data/Thailand.csv (variant "Whole" = "Passenger Car and Pickup Truck").
#
# See scripts/fetch_thailand.py for the auth flow, the API request shape, and
# the fuel-column mapping. Credentials come from repository secrets:
#   THAILAND_AIU_THAIAUTO_USER  (member username; defaults to "leraffl")
#   THAILAND_AIU_THAIAUTO_PW    (member password)
#
# The API listens on port 3000. GitHub-hosted runners reach it directly; if a
# runner's egress IP is ever blocked, set repository secret THAILAND_HTTPS_PROXY
# to a permissive proxy. When the CSV changes, this workflow dispatches
# render-country.yml for the Whole variant.

on:
  # TEMPORARY: validate the live login/fetch on this branch before merge.
  push:
    branches: [claude/thailand-auto-registration-updates-gq9ocw]
    paths: ['scripts/fetch_thailand.py', '.github/workflows/fetch-thailand.yml']
  workflow_dispatch:
    inputs:
      years:
        description: "Year(s) to fetch: '2026', '2018-2026', or '2024,2025'"
        required: false
        default: ''
      force:
        description: 'Skip the "already current" early-exit check'
        required: false
        default: false
        type: boolean
  schedule:
    # Daily 1st–20th at 04:40 UTC. The AIU portal publishes the previous month's
    # figures partway through the following month; we poll daily until the row
    # materialises, then the per-month early-exit makes subsequent runs no-ops
    # (no diff, no commit, no render trigger). 04:40 UTC stays clear of
    # fetch-denmark (05:15), fetch-netherlands (06:30) and fetch-acea (08:00).
    - cron: '40 4 1-20 * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch & update Thailand CSV
        run: |
          python scripts/fetch_thailand.py \
            ${YEARS:+--years "$YEARS"} \
            ${FORCE:+--force}
        env:
          YEARS: ${{ inputs.years }}
          FORCE: ${{ inputs.force == true && '1' || '' }}
          THAILAND_AIU_THAIAUTO_USER: ${{ secrets.THAILAND_AIU_THAIAUTO_USER || 'leraffl' }}
          THAILAND_AIU_THAIAUTO_PW: ${{ secrets.THAILAND_AIU_THAIAUTO_PW }}
          THAILAND_HTTPS_PROXY: ${{ secrets.THAILAND_HTTPS_PROXY }}
          THAILAND_DEBUG: '1'

      - name: Detect whether the CSV changed
        id: changed
        run: |
          git add -N data/Thailand.csv 2>/dev/null || true
          if git diff --quiet -- data/Thailand.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to data/Thailand.csv"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data/Thailand.csv changed"
          fi

      - name: Commit if changed
        id: commit
        if: steps.changed.outputs.changed == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          add: data/Thailand.csv
          message: 'chore: update Thailand data from aiu.thaiauto.or.th (veh_reg_fuel)'
          default_author: github_actions

      - name: Trigger render for Whole
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run render-country.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f country=Thailand \
            -f variant=Whole
