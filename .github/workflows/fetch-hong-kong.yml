name: Fetch Hong Kong data (TD first registrations)

# Fetches the Transport Department's record-level "Particulars of first
# registered vehicles" (DATA.GOV.HK CKAN — one CSV per month, one row per
# vehicle, with class, make, model, fuel, first-registration status, gross
# weight and year of manufacture) and upserts the Hong Kong CSVs:
#
#   data/Hong Kong.csv        Whole   new private cars (TD status A/B/C1, EU M1)
#   data/Hong Kong_Used.csv   Used    used-import private cars (status C2)
#   data/Hong Kong_Vans.csv   Vans    new light goods vehicles <= 3.5 t (EU N1)
#
# Fuel is TD's own field (Electric -> BEV). It has no hybrid value: plug-in
# hybrids register as Petrol and are classified from the model designation
# (PHEV_RULES in the script); full and mild hybrids stay in PETROL.
# Also writes market/hong_kong_top.json (top BEV / PHEV brands and models).
# Every run cross-checks the record files against TD's own aggregate table
# 4.1(e) and aborts on a real mismatch.
# Full method, governance checks and a debugging runbook:
# docs/architecture/41-source-hong-kong.md.
#
# TD publishes month M's file irregularly, between the 13th and the 28th of
# M+1 (2026: Apr 14, May 13, Jun 22, Jul 28, Aug 21). Polled twice daily
# every day; the script reads the portal's resource list (one small JSON
# request) and exits without downloading when every CSV already has the
# newest published month. A real run reads the newest 12 monthly files
# (~5 MB) so the trailing-12-month top list is rebuilt; `backfill`
# re-derives every month from 2019-11 (~30 MB).
#
# Rendering: dispatches render-country.yml ONCE with the pipe-separated list
# of touched variants (serial in one run, one commit — see fetch-spain.yml).

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variant to fetch (default: all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - Whole
          - Used
          - Vans
      period:
        description: 'Target month YYYY-MM (default: newest month on the portal)'
        required: false
        default: ''
      backfill:
        description: 'Re-derive every month from 2019-11 (downloads every monthly file)'
        required: false
        default: false
        type: boolean
      force:
        description: 'Ignore the self-throttle / completeness / cross-check guards and foreign rows'
        required: false
        default: false
        type: boolean
  schedule:
    # Twice daily, 03:20 and 11:20 UTC (HK 11:20 and 19:20 — TD uploads in
    # Hong Kong office hours).
    - cron: '20 3,11 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      any_changed: ${{ steps.fetch.outputs.changed }}
      changed_variants: ${{ steps.fetch.outputs.changed_variants }}
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests

      # Scope and the plug-in rules fail silently when wrong, so the
      # regression tests gate the fetch rather than trail it (no network).
      - name: Test the fetcher
        run: |
          python scripts/test_fetch_hong_kong.py
          python scripts/test_market_top.py

      - name: Fetch & update Hong Kong CSVs
        id: fetch
        run: |
          python scripts/fetch_hong_kong.py \
            ${VARIANT:+--variant "$VARIANT"} \
            ${PERIOD:+--period "$PERIOD"} \
            ${BACKFILL:+--backfill} \
            ${FORCE:+--force}
        env:
          VARIANT:  ${{ inputs.variant }}
          PERIOD:   ${{ inputs.period }}
          BACKFILL: ${{ inputs.backfill == true && '1' || '' }}
          FORCE:    ${{ inputs.force == true && '1' || '' }}

      - name: Commit if changed
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          # A git pathspec glob, not a shell glob: the action splits this input
          # on whitespace, so "data/Hong Kong.csv" would become two arguments.
          # Matches data/Hong Kong.csv, _Used.csv and _Vans.csv.
          add: |
            data/Hong?Kong*.csv
            market/hong_kong_top.json
          message: 'chore: update Hong Kong data from TD first registrations (data.gov.hk)'
          default_author: github_actions
          # Rebase over anything that landed while this job ran instead of
          # failing the push with non-fast-forward (same as fetch-spain.yml).
          pull: '--rebase --autostash'

  render:
    needs: fetch
    if: needs.fetch.outputs.committed == 'true' && needs.fetch.outputs.changed_variants != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch render for Hong Kong
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VARIANTS_JSON: ${{ needs.fetch.outputs.changed_variants }}
        run: |
          variants=$(jq -r 'join("|")' <<< "$VARIANTS_JSON")
          if [ -z "$variants" ]; then
            echo "No changed variants to render."
            exit 0
          fi
          gh workflow run render-country.yml \
            --ref "$GITHUB_REF_NAME" \
            -f country="Hong Kong" \
            -f variants="$variants"
